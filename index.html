<meta name="apple-mobile-web-app-title" content="One Cart">
<style>
  :root{
    --bg:#FBF8F2; --card:#FFFFFF; --ink:#2B2320; --ink-soft:#8A8078;
    --border:#ECE6DC; --accent:#FF5D7A; --accent-soft:#FFE3E8; --accent-ink:#8C1F37;
    --accent-strong:#D8365B; /* filled controls with white text: 4.6:1 */
    --done:#6E9A68; --checked-green:#3F8557; --danger:#A32E2E;
    --toast-bg:#2B2320; --toast-ink:#FFFFFF; --toast-action:#FF8DA3; --backdrop:rgba(43,35,32,.4);
    --seg-bg:#EDE6DA; --seg-shadow:0 1px 3px rgba(43,35,32,.14);
    --radius:16px; --shadow:0 1px 2px rgba(43,35,32,.06), 0 6px 20px rgba(43,35,32,.06);
    color-scheme:light;
  }
  /* Dark theme. Follows the system by default; Settings can pin light or dark
     via data-theme on <html> (applied before first paint by the inline script
     in <head>, so there's no flash). */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1614; --card:#26211E; --ink:#F4EEE7; --ink-soft:#A69C93;
      --border:#3A332E; --accent:#FF6B86; --accent-soft:#4A2531; --accent-ink:#FFB6C4;
      --accent-strong:#D8365B;
      --done:#5F8F5A; --checked-green:#8CCB9A; --danger:#FF8A80;
      --toast-bg:#F4EEE7; --toast-ink:#1A1614; --toast-action:#C42B50; --backdrop:rgba(0,0,0,.55);
      --seg-bg:#110E0D; --seg-shadow:0 1px 3px rgba(0,0,0,.5);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1614; --card:#26211E; --ink:#F4EEE7; --ink-soft:#A69C93;
    --border:#3A332E; --accent:#FF6B86; --accent-soft:#4A2531; --accent-ink:#FFB6C4;
    --accent-strong:#D8365B;
    --done:#5F8F5A; --checked-green:#8CCB9A; --danger:#FF8A80;
    --toast-bg:#F4EEE7; --toast-ink:#1A1614; --toast-action:#C42B50; --backdrop:rgba(0,0,0,.55);
    --seg-bg:#110E0D; --seg-shadow:0 1px 3px rgba(0,0,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  /* html carries the background so iOS rubber-banding shows the same color. */
  html{background:var(--bg);}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  /* Tappable things behave like controls, not text: no selection, no
     long-press callout, no grey tap flash. */
  .btn,.chip,.tab-btn,.item-row,.check-circle,.icon-btn,.suggest-row,.store-tag-toggle,.link-btn,.stepper,.toast{
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  svg.ic{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  svg.ic.sm{width:18px;height:18px;}
  .shell{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
  button{font:inherit;touch-action:manipulation;}
  .check-circle,.item-row{touch-action:manipulation;}
  input,textarea{font:inherit;}
  .btn{border:none;border-radius:999px;padding:13px 20px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent-strong);color:#fff;}
  .btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--border);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-block{width:100%;display:block;}
  .btn[disabled]{opacity:.55;}
  .link-btn{background:none;border:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:8px;}
  .link-btn.danger{color:var(--danger);}
  .icon-btn{background:none;border:none;cursor:pointer;padding:9px;border-radius:12px;color:var(--ink);display:flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;}
  .icon-btn:active{background:var(--accent-soft);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input, .text-input{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none;
  }
  .field input::placeholder, .text-input::placeholder{color:var(--ink-soft);opacity:.8;}
  .field input:focus, .text-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;}
  .helper-text{color:var(--ink-soft);font-size:15px;margin:0 0 18px;}

  /* onboarding / auth */
  .onboard{padding:calc(24px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column;}
  .onboard-hero{text-align:center;margin:6vh 0 28px;}
  .onboard-hero .mark{display:flex;justify-content:center;color:var(--accent);margin-bottom:10px;}
  .onboard-hero h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px;}
  .onboard-hero p{font-size:16px;}
  .onboard-hero p{color:var(--ink-soft);margin:0;}
  .link-row{text-align:center;margin-top:10px;}

  /* app shell */
  .app-top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top);}
  @supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
    .app-top,.bottom-bar{background:color-mix(in srgb, var(--bg) 84%, transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);}
  }
  .app-header{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px 18px;}
  .app-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;}
  .app-title .mark{display:flex;color:var(--accent);flex:0 0 auto;}
  .app-title .title-text{overflow:hidden;text-overflow:ellipsis;}
  .header-actions{display:flex;gap:0;flex:0 0 auto;color:var(--ink);}
  .presence-banner{margin:0 18px 10px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:600;}
  .offline-pill{margin:0 18px 10px;padding:8px 12px;border-radius:12px;border:1px dashed var(--border);color:var(--ink-soft);font-size:14px;font-weight:600;}
  /* iOS-style segmented control */
  .tabs{display:flex;padding:0 18px 10px;}
  .seg{display:flex;flex:1;background:var(--seg-bg);border-radius:12px;padding:3px;}
  .tab-btn{flex:1;padding:8px 0;border-radius:9px;border:none;background:transparent;color:var(--ink-soft);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;}
  .tab-btn.active{background:var(--card);color:var(--ink);box-shadow:var(--seg-shadow);}
  .tab-count{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;font-size:11px;line-height:18px;background:var(--accent-soft);color:var(--accent-ink);vertical-align:1px;font-variant-numeric:tabular-nums;}
  .tab-btn.active .tab-count{background:var(--accent-strong);color:#fff;}

  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;}
  .chip.quick{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink);}
  .chip.quick:active{transform:scale(.96);}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 24px;}
  .section-label{padding:6px 18px 4px;font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .suggest-list{display:flex;flex-direction:column;gap:6px;padding:0 18px 12px;}
  .suggest-row{text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-weight:600;font-size:16px;cursor:pointer;}
  .suggest-row:active{background:var(--accent-soft);border-color:var(--accent-soft);}

  .add-row{display:flex;gap:8px;padding:6px 18px 12px;}
  .add-row input{flex:1;}
  .add-row .btn{padding:13px 18px;}

  .list{flex:1;padding:0 18px calc(24px + env(safe-area-inset-bottom));}
  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;}
  .empty-state .mark{font-size:40px;display:block;margin-bottom:10px;}

  .item-row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:opacity .2s,transform .1s;}
  .item-row:active{transform:scale(.99);}
  .item-row.is-checked{opacity:.72;}
  .check-circle{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--card);position:relative;transition:background .15s,border-color .15s;}
  /* Invisible halo so a thumb can hit the circle without hitting the row. */
  .check-circle::before{content:"";position:absolute;inset:-11px;border-radius:50%;}
  .check-circle.done{background:var(--done);border-color:var(--done);color:#fff;}
  .check-circle.pop{animation:pop .28s ease-out;}
  @keyframes pop{0%{transform:scale(.6);}60%{transform:scale(1.18);}100%{transform:scale(1);}}
  .item-body{flex:1;min-width:0;}
  .item-name{font-weight:600;font-size:17px;line-height:1.3;word-break:break-word;}
  .item-name.done{text-decoration:line-through;color:var(--ink-soft);}
  .item-name.checked{text-decoration:line-through;color:var(--checked-green);}
  .item-note{font-size:14px;font-style:italic;color:var(--ink-soft);margin-top:3px;word-break:break-word;}
  .item-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
  .tag-pill{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:3px 8px;border-radius:999px;}
  .item-meta{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .qty-badge{display:inline-block;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;background:var(--card);overflow:hidden;}
  .stepper button{background:none;border:none;width:46px;height:42px;font-size:22px;line-height:1;color:var(--ink);cursor:pointer;}
  .stepper button:active{background:var(--accent-soft);}
  .stepper button[disabled]{opacity:.3;}
  .stepper output{min-width:40px;text-align:center;font-weight:700;font-size:16px;}
  .qty-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .qty-row label{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .nudge-banner{margin:0 18px 10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;display:flex;align-items:flex-start;gap:10px;}
  .nudge-banner b{font-weight:700;}
  .nudge-banner .link-btn{padding:0;flex:0 0 auto;color:var(--accent-ink);}
  .nudge-cta{margin:0 0 8px;text-align:center;}
  .install-tip{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:18px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.4;}
  .install-tip b{color:var(--ink);}
  .install-tip svg{flex:0 0 auto;margin-top:1px;color:var(--accent);}
  .status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;}
  .bottom-bar{position:sticky;bottom:0;z-index:4;padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);}
  .trip-progress{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;font-variant-numeric:tabular-nums;}
  .trip-bar{flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden;}
  .trip-bar span{display:block;height:100%;border-radius:3px;background:var(--checked-green);transition:width .3s;}

  /* sheet overlay */
  .sheet-backdrop{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:flex-end;z-index:50;}
  .sheet{position:relative;background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;}
  .sheet-backdrop.sheet-enter{animation:fadeIn .2s ease-out;}
  .sheet-backdrop.sheet-enter .sheet{animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);}
  @keyframes fadeIn{from{opacity:0;}}
  @keyframes sheetUp{from{transform:translateY(40px);}}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
  .sheet h2{font-size:20px;letter-spacing:-.01em;margin:0 0 14px;padding-right:30px;}
  .sheet-close{position:absolute;top:14px;right:14px;font-size:22px;line-height:1;color:var(--ink-soft);}
  .store-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .store-tag-toggle{padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600;font-size:14px;}
  .store-tag-toggle.on{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;}
  .store-manage-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .settings-section{margin-bottom:22px;}
  .settings-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin:0 0 10px;}
  .code-box{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .code-box .mono{font-size:18px;font-weight:700;color:var(--accent-ink);}
  .people-row{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--ink-soft);}

  var s = cleanItemName(raw), m;

var EMOJI_RULES = EMOJI_KEYWORDS.map(function(pair){
  var kw = pair[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return {re: new RegExp("(^|[^a-z])"+kw+"(s|es)?($|[^a-z])"), emoji: pair[1]};
});
var emojiGuessCache = {};
function guessEmoji(name){
  var key = String(name||"").toLowerCase().trim();
  if(!key) return null;
  if(EMOJI_MAP[key] !== undefined) return EMOJI_MAP[key];
  if(emojiGuessCache[key] !== undefined) return emojiGuessCache[key];
  var hit = null;
  for(var i=0;i<EMOJI_RULES.length;i++){
    if(EMOJI_RULES[i].re.test(key)){ hit = EMOJI_RULES[i].emoji; break; }
  }
  emojiGuessCache[key] = hit;
  return hit;
}

function conciseNameFromProduct(product){
  var tags = (product.categories_tags||[]).slice().reverse();
  for(var i=0;i<tags.length;i++){
    var idx = tags[i].indexOf(":");
    var key = idx===-1 ? tags[i] : tags[i].slice(idx+1);
    if(CATEGORY_TERM_MAP[key]) return CATEGORY_TERM_MAP[key];
  }
  if(product.generic_name && product.generic_name.trim() && product.generic_name.length < 30){
    var g = product.generic_name.trim();
    return g.charAt(0).toUpperCase()+g.slice(1);
  }
  var name = String(product.product_name||"Item").replace(/\([^)]*\)/g,"").trim();
  return name.length <= 30 ? name : name.slice(0,30).trim();
}
function relTime(iso){
  if(!iso) return "";
  var d = (iso.toDate) ? iso.toDate() : new Date(iso);
  var diffMs = Date.now() - d.getTime();
  var mins = Math.round(diffMs/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins+"m ago";
  var hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+"h ago";
  var days = Math.round(hrs/24);
  if(days < 7) return days+"d ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function personName(uid){
  var p = (S.space.people||[]).find(function(x){ return x.uid===uid; });
  return p ? p.name : null;
}

/* ---------------- barcode scan -> product photo ---------------- */
// Loaded on demand (only when someone actually scans) rather than up front,
// since most visits never touch this and the library is a few hundred KB.
var zxingLoadPromise = null;
function loadZxing(){
  if(window.ZXing) return Promise.resolve();
  if(zxingLoadPromise) return zxingLoadPromise;
  zxingLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = function(){ resolve(); };
    s.onerror = function(){ zxingLoadPromise = null; reject(new Error("load failed")); };
    document.head.appendChild(s);
  });
  return zxingLoadPromise;
}
var activeScanReader = null;
function stopActiveScan(){
  if(activeScanReader){ try{ activeScanReader.reset(); }catch(e){} activeScanReader = null; }
}
function startBarcodeScan(){
  var itemId = S.sheet.itemId; // present -> attach photo to this existing item; absent -> "add new item" mode
  function goBack(){ if(itemId) openSheet({type:"editItem", itemId:itemId}); else { S.sheet = null; render(); } }
  function setStatus(msg){ var el = document.getElementById("scan-status"); if(el) el.textContent = msg; }
  loadZxing().then(function(){
    if(!(S.sheet && S.sheet.type==="scan")) return;
    var reader = new window.ZXing.BrowserMultiFormatReader();
    activeScanReader = reader;
    var pickDevice = reader.listVideoInputDevices().catch(function(){ return []; });
    return pickDevice.then(function(devices){
      var rear = devices.find(function(d){ return /back|rear|environment/i.test(d.label||""); });
      var deviceId = rear ? rear.deviceId : (devices.length ? devices[devices.length-1].deviceId : undefined);
      return reader.decodeOnceFromVideoDevice(deviceId, "scan-video");
    }).then(function(result){
      stopActiveScan();
      var code = result.getText();
      setStatus("Looking up "+code+"…");
      return fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json")
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(!data || data.status !== 1){ throw new Error("not_found"); }
          var img = data.product.image_front_url || data.product.image_url;
          if(!img || !/^https:\/\//.test(img)){ throw new Error("no_image"); }
          return {image: img, name: conciseNameFromProduct(data.product)};
        });
    }).then(function(found){
      if(itemId){
        store.setItemNoteImage(S.spaceCode, itemId, found.image).catch(function(){ showToast("Couldn't save that photo"); });
        showToast("Photo added");
        goBack();
      } else {
        var existing = findExistingMatch(found.name, true);
        S.sheet = {type:"scan", entered: true,
          result:{name: found.name, image: found.image, matchedId: existing?existing.id:null, matchedName: existing?existing.name:null}};
        render();
      }
    }).catch(function(err){
      stopActiveScan();
      var msg = "No luck this time — add a note instead?";
      if(err && err.message==="not_found") msg = "Not in the product database this time — no problem, add a note instead";
      else if(err && err.message==="no_image") msg = "Found the product, but no photo on file — add a note instead";
      else if(err && err.name==="NotAllowedError") msg = "Camera access denied — check your browser settings";
      showToast(msg);
      goBack();
    });
  }).catch(function(){
    showToast("Couldn't load the scanner — check your connection");
    goBack();
  });
}

    if(missingItems.length){

          storeTags: [], status: "suggested", timesAdded: 0,

/* ---------------- nudges ("anything else?") ---------------- */
// Anonymous sign-in is per browser storage, and on iPhone the Safari tab and
// the Home Screen app are separate stores, so one person easily ends up with
// two uids in `people`. Treat same-name entries as the same human: dedupe
// for display, keep every uid for delivery (a nudge should reach all of
// their devices), and never count my own other device as a partner.
function sameName(a, b){ return String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase(); }
function isMe(uid){
  if(uid===S.meUid) return true;
  var name = personName(uid);
  return !!(name && S.me && sameName(name, S.me));
}
function partnerPeople(){ return (S.space.people||[]).filter(function(p){ return !isMe(p.uid); }); }
function uniquePeople(list){
  var out = [];
  (list||[]).forEach(function(p){ if(!out.some(function(q){ return sameName(q.name, p.name); })) out.push(p); });
  return out;
}
function partnerNames(){ return uniquePeople(partnerPeople()).map(function(p){ return p.name; }).join(" & "); }
function defaultNudgeMessage(){
  var anyChecked = S.items.some(function(it){ return it.status==="active" && it.checked; });
  if(anyChecked) return "Heading to checkout — anything else?";
  if(S.filterStore) return "At "+S.filterStore+" now — anything else?";
  return "Heading to the store — anything else?";
}
function loadSeenNudges(){ try{ return JSON.parse(localStorage.getItem("thoc_seen_nudges")||"[]"); }catch(e){ return []; } }
function markNudgeSeen(id){
  var seen = loadSeenNudges().filter(function(x){ return x!==id; }); seen.push(id);
  try{ localStorage.setItem("thoc_seen_nudges", JSON.stringify(seen.slice(-50))); }catch(e){}
}
// The newest nudge addressed to me from the last 3 hours that I haven't
// dismissed. Shown as a banner inside the app; the push is the same thing
// delivered when the app is closed.
function pendingNudge(){
  var seen = loadSeenNudges(), now = Date.now();
  var mine = S.nudges.filter(function(n){
    if(isMe(n.fromUid) || (n.toUids||[]).indexOf(S.meUid)===-1 || seen.indexOf(n.id)!==-1) return false;
    var ms = (n.createdAt && n.createdAt.toMillis) ? n.createdAt.toMillis() : now;
    return now-ms < 3*3600e3;
  }).sort(function(a,b){
    var ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
    var tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
    return tb-ta;
  });
  return mine[0] || null;
}
var prunedNudges = false;
function pruneOldNudges(list){
  if(prunedNudges) return; prunedNudges = true;
  var cutoff = Date.now() - 24*3600e3;
  list.forEach(function(n){
    var ms = (n.createdAt && n.createdAt.toMillis) ? n.createdAt.toMillis() : Date.now();
    if(ms < cutoff) store.deleteNudge(S.spaceCode, n.id).catch(function(){});
  });
}
function sendNudge(message){
  var to = partnerPeople().map(function(p){ return p.uid; });
  if(!to.length){ showToast("Your partner hasn't joined yet"); return Promise.resolve(); }
  return store.sendNudge(S.spaceCode, {
    fromUid: S.meUid, fromName: S.me, toUids: to,
    message: message, store: S.filterStore || null,
    link: location.origin + location.pathname
  }).then(function(){ showToast("Nudged "+partnerNames()+" 💌"); })
    .catch(function(){ showToast("Couldn't send that — try again"); });
}

/* ---------------- push notifications (FCM) ---------------- */
function pushPermission(){ return ("Notification" in window) ? Notification.permission : "unsupported"; }
function pushState(){
  if(!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)){
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    var standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
    return (ios && !standalone) ? "needs_homescreen" : "unsupported";
  }
  if(!FCM_VAPID_KEY) return "not_configured";
  if(Notification.permission==="denied") return "denied";
  if(Notification.permission==="granted" && S.pushEnabled) return "on";
  return "off";
}
var pushTokenPromise = null;
function registerPushToken(){
  if(pushTokenPromise) return pushTokenPromise;
  var swReady = new Promise(function(resolve, reject){
    var t = setTimeout(function(){ reject(new Error("sw_timeout")); }, 8000);
    navigator.serviceWorker.ready.then(function(reg){ clearTimeout(t); resolve(reg); }, reject);
  });
  pushTokenPromise = import("https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js").then(function(m){
    return m.isSupported().then(function(ok){
      if(!ok) throw new Error("unsupported");
      return swReady.then(function(reg){
        return m.getToken(m.getMessaging(fbApp), {vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg});
      });
    });
  }).then(function(token){
    if(!token) throw new Error("no_token");
    return store.saveFcmToken(S.meUid, token).then(function(){
      S.pushEnabled = true;
      try{ localStorage.setItem("thoc_push", "on"); }catch(e){}
    });
  });
  pushTokenPromise.catch(function(){ pushTokenPromise = null; });
  return pushTokenPromise;
}
function enablePush(){
  if(S.pushBusy) return;
  S.pushBusy = true; render();
  var perm = ("Notification" in window) ? Notification.requestPermission() : Promise.resolve("unsupported");
  Promise.resolve(perm).then(function(result){
    if(result!=="granted") throw new Error(result);
    return registerPushToken();
  }).then(function(){
    showToast("You'll get nudges on this device");
  }).catch(function(err){
    var why = err && err.message;
    showToast(why==="denied" ? "Notifications are blocked for this site" : "Couldn't turn on notifications here");
  }).then(function(){ S.pushBusy = false; render(); });
}
// Tokens rotate; refresh ours quietly on each open once the user opted in.
function refreshPushIfEnabled(){
  var on = false; try{ on = localStorage.getItem("thoc_push")==="on"; }catch(e){}
  if(on && FCM_VAPID_KEY && pushPermission()==="granted" && S.meUid){
    S.pushEnabled = true;
    registerPushToken().catch(function(){});
  }
}

var lastSyncErrorAt = 0;
function syncError(){
  if(Date.now()-lastSyncErrorAt < 60000) return;
  lastSyncErrorAt = Date.now();
  showToast("Couldn't sync — check your connection");
}
var unsubs = [];
function teardownSubs(){ unsubs.forEach(function(u){ try{u();}catch(e){} }); unsubs=[]; stopPresenceHeartbeat(); }

// Presence: a lightweight per-person heartbeat doc so partners can see when
// each other has the list open right now. Piggybacks the same interval to
// also re-render, since "is that heartbeat now stale" only changes with time,
// not with any Firestore event we'd otherwise react to.
var presenceInterval = null;
function presenceBeat(){
  if(S.spaceCode && S.meUid && document.visibilityState==="visible"){
    store.updatePresence(S.spaceCode, S.meUid, S.me).catch(function(){});
  }
  renderPreservingInput();
}
function startPresenceHeartbeat(){
  stopPresenceHeartbeat();
  presenceBeat();
  presenceInterval = setInterval(presenceBeat, 25000);
  document.addEventListener("visibilitychange", presenceBeat);
}
function stopPresenceHeartbeat(){
  if(presenceInterval){ clearInterval(presenceInterval); presenceInterval=null; }
  document.removeEventListener("visibilitychange", presenceBeat);
}
function activePartners(){
  var now = Date.now();
  return S.presence.filter(function(p){
    if(p.uid===S.meUid) return false;
    var ms = (p.lastActive && p.lastActive.toMillis) ? p.lastActive.toMillis() : 0;
    return (now-ms) < 90000;
  });
}

function persistSpace(){ try{ localStorage.setItem("thoc_space", S.spaceCode||""); }catch(e){} }
function loadLocalSpace(){ try{ return localStorage.getItem("thoc_space")||null; }catch(e){ return null; } }
function forgetLocalSpace(){ try{ localStorage.removeItem("thoc_space"); }catch(e){} }

/* ---------------- render root ---------------- */
var app = document.getElementById("app");
function render(){
  // A finger is mid-swipe or mid-drag: replacing the DOM now would yank the
  // row away. Apply the latest state as soon as the gesture ends.
  if(S.gesturing){ S.renderPending = true; return; }
  var html;
  if(!S.authReady){
    html = '<div class="shell">'+skeletonHtml("Connecting…")+'</div>';
  } else if(!S.spaceCode || S.loadingSpace){
    html = '<div class="shell">'+ (S.loadingSpace ? skeletonHtml("Opening your list…") : entryHtml()) +'</div>';
  } else {
    html = '<div class="shell">'+appHtml()+'</div>';
  }
  if(S.toast) html += toastHtml();
  if(S.sheet) html += sheetHtml();
  // The barcode scanner streams into #scan-video; a re-render would replace
  // it with a blank element and the preview would go black. Re-adopt the live
  // one instead.
  var liveVideo = document.getElementById("scan-video");
  app.innerHTML = html;
  if(liveVideo && liveVideo.srcObject){
    var newVideo = document.getElementById("scan-video");
    if(newVideo) newVideo.replaceWith(liveVideo);
  }
  bindToast();
  // Keep the toast clear of the sticky bottom bar (and its Undo tappable).
  var toastEl = document.querySelector(".toast"), barEl = document.querySelector(".bottom-bar");
  if(toastEl && barEl && !S.sheet) toastEl.style.bottom = (barEl.offsetHeight + 12) + "px";

  if(!S.authReady) return;
  if(!S.spaceCode || S.loadingSpace){ if(!S.loadingSpace) bindEntry(); return; }
  bindApp();
  if(S.sheet) bindSheet();
}

// Real-time snapshots can fire mid-keystroke (e.g. your own write echoing
// back, or your partner editing at the same moment). A plain render() would
// wipe out whatever is being typed, so preserve the focused text input's
// value/cursor/scroll across the re-render.
function renderPreservingInput(){
  var active = document.activeElement;
  var save = null;
  if(active && (active.tagName==="INPUT" || active.tagName==="TEXTAREA") && active.id){
    save = {id:active.id, value:active.value, start:active.selectionStart, end:active.selectionEnd};
  }
  // The note textarea saves on a debounce, so it can hold unsaved text while
  // unfocused (user just tapped a store tag). Keep that text through the redraw.
  var noteEl = document.getElementById("item-note-input");
  var pendingNote = (noteEl && (!save || save.id!=="item-note-input")) ? noteEl.value : null;
  render();
  if(save){
    var el = document.getElementById(save.id);
    if(el){
      el.value = save.value;
      el.focus();
      try{ el.setSelectionRange(save.start, save.end); }catch(e){}
    }
  }
  if(pendingNote !== null){
    var n2 = document.getElementById("item-note-input");
    if(n2 && n2.value !== pendingNote) n2.value = pendingNote;
  }
}

function bindEntry(){
  var nameEl = document.getElementById("entry-name");
  var codeEl = document.getElementById("entry-code");
  if(!S.me && nameEl){ setTimeout(function(){ nameEl.focus(); },0); }
  var b;
  if((b=document.getElementById("entry-generate"))) b.onclick = function(){ codeEl.value = genCode(); codeEl.focus(); };
  if((b=document.getElementById("entry-change-name"))) b.onclick = function(){ S.me = null; render(); };

function enterSpace(code){
  S.spaceCode = code; S.loadingSpace = true; persistSpace();
  teardownSubs();
  render();
  store.ensureSpace(code).then(function(space){
    S.space = space; S.loadingSpace = false;
    var mine = (space.people||[]).find(function(p){ return p.uid===S.meUid; });
    if(!mine){
      // arrayUnion rather than read-modify-write: two partners joining at the
      // same moment used to be able to overwrite each other.
      store.joinSpace(code, S.meUid, S.me).catch(function(){});
    } else if(mine.name && mine.name !== S.me){
      // Renamed from another device: the shared list wins, this device follows.
      S.me = mine.name;
      store.saveUserProfile(S.meUid, {displayName: mine.name}).catch(function(){});
    }
    unsubs.push(store.subscribeSpace(code, function(sp){ S.space = sp; renderPreservingInput(); }, syncError));
    unsubs.push(store.subscribeItems(code, function(items){ S.items = items; renderPreservingInput(); }, syncError));
    unsubs.push(store.subscribePresence(code, function(list){ S.presence = list; renderPreservingInput(); }));
    unsubs.push(store.subscribeNudges(code, function(list){ S.nudges = list; pruneOldNudges(list); renderPreservingInput(); }));
    refreshPushIfEnabled();
    startPresenceHeartbeat();
    render();
  }).catch(function(){
    S.loadingSpace = false; S.spaceCode = null; forgetLocalSpace();
    showToast("Couldn't open that list — check the code and try again");
  });
}

/* ---------------- main app ---------------- */
function storesList(){ return (S.space.stores||[]).slice().sort(function(a,b){return a.localeCompare(b);}); }

function matchesFilter(it){
  if(!S.filterStore) return true;
  var tags = it.storeTags||[];
  if(tags.length===0) return true;
  return tags.indexOf(S.filterStore) !== -1;
}
// `ignoreSearch` gives the whole (store-filtered) list, for the trip progress
// bar; the rendered rows additionally narrow to the search query so typing
// "milk" shows the Milk already on the list, not just catalog suggestions.
function activeItems(ignoreSearch){
  var q = ignoreSearch ? "" : (S.searchQuery||"").trim().toLowerCase();
  return S.items.filter(function(it){
      return it.status==="active" && matchesFilter(it) && (!q || (it.name||"").toLowerCase().indexOf(q) !== -1);
    })
    .sort(function(a,b){
      var ca = a.checked ? 1 : 0, cb = b.checked ? 1 : 0;
      return ca !== cb ? ca-cb : (a.name||"").localeCompare(b.name||"");
    });
}
function doneItems(){
  var cutoff = S.space.historyClearedAt;
  var cutoffMs = (cutoff && cutoff.toMillis) ? cutoff.toMillis() : 0;
  return S.items.filter(function(it){
    if(it.status!=="done" || !matchesFilter(it)) return false;
    var doneMs = (it.lastDoneAt && it.lastDoneAt.toMillis) ? it.lastDoneAt.toMillis() : 0;
    return doneMs > cutoffMs;
  }).sort(function(a,b){
    var ta = a.lastDoneAt && a.lastDoneAt.toMillis ? a.lastDoneAt.toMillis() : 0;
    var tb = b.lastDoneAt && b.lastDoneAt.toMillis ? b.lastDoneAt.toMillis() : 0;
    return tb-ta;
  }).slice(0,60);
}
function browseCandidates(){
  var activeKeys = {};
  S.items.forEach(function(it){ if(it.status==="active") activeKeys[it.nameKey]=true; });
  return S.items.filter(function(it){ return it.status!=="active" && matchesFilter(it) && !activeKeys[it.nameKey]; })
    .sort(function(a,b){
      var diff = (b.timesAdded||0)-(a.timesAdded||0);
      return diff !== 0 ? diff : (a.name||"").localeCompare(b.name||"");
    });
}
function favoriteCandidates(){
  return browseCandidates().filter(function(it){ return (it.timesAdded||0) > 0; }).slice(0,10);
}
function browseAlphabetical(){
  return browseCandidates().slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
}
function searchSuggestions(query){
  var q = query.trim().toLowerCase();
  if(!q) return [];
  return browseCandidates().filter(function(it){ return it.name.toLowerCase().indexOf(q) !== -1; }).slice(0,6);
}
// Exact match on nameKey, or on the document id the name would slug to (so
// "Red-Onion" lands on "Red Onion" instead of silently overwriting it).
// `fuzzy` additionally accepts a single substring candidate - only used for
// barcode scans, where the match is shown to the user before anything is
// written. Typing "Potatoes" must never quietly add "Sweet Potatoes".
function findExistingMatch(name, fuzzy){
  var key = cleanItemName(name).toLowerCase();
  var id = slugify(key);
  var existing = S.items.find(function(it){ return it.nameKey===key; }) ||
                 S.items.find(function(it){ return it.id===id; });
  if(!existing && fuzzy){
    var matches = searchSuggestions(name);
    if(matches.length === 1) existing = matches[0];
  }
  return existing || null;
}

      }
      if(bq || allBrowse.length <= 24){
        html += '<div class="section-label">'+(bq ? 'Matches' : 'All items')+'</div><div class="chip-grid">'+allBrowse.map(chipHtml).join("")+'</div>';
      } else {
        // Past a couple of dozen items a flat wall of chips is hard to scan;
        // group alphabetically so the eye can jump.
        var groups = {}, order = [];
        allBrowse.forEach(function(it){
          var ch = (it.name||"").charAt(0).toUpperCase();
          if(!/[A-Z]/.test(ch)) ch = "#";
          if(!groups[ch]){ groups[ch] = []; order.push(ch); }
          groups[ch].push(it);
        });
        order.forEach(function(ch){
          html += '<div class="section-label">'+escapeHtml(ch)+'</div><div class="chip-grid" style="padding-bottom:10px;">'+groups[ch].map(chipHtml).join("")+'</div>';
        });
      }
    }
    html += '</div>';
  } else {
    html += '</div>'; // .app-top
    var done = doneItems();
    if(done.length){
      html += '<div style="padding:6px 18px 0;text-align:right;"><button class="link-btn" id="clear-history-btn" style="padding:4px 0;">Clear history</button></div>';
    }
    html += '<div class="list" style="padding-top:4px;">';
    if(!done.length){
      html += '<div class="empty-state"><span class="mark">📜</span>Nothing checked off yet.</div>';
    } else {
      done.forEach(function(it){ html += itemRowHtml(it, true); });
    }
    html += '</div>';
  }
  return html;
}

function itemRowHtml(it, isHistory){
  var tags = (it.storeTags||[]);
  var checked = !isHistory && !!it.checked;
  var em = itemEmoji(it);
  var html = '<div class="item-row'+(checked?" is-checked":"")+'" data-item="'+escapeHtml(it.id)+'" data-action="'+(isHistory?"restore":"edit")+'">';
  if(isHistory){
    html += '<div class="check-circle done" role="button" aria-label="Add '+escapeHtml(it.name)+' back to list" data-action="restore" data-item="'+escapeHtml(it.id)+'">+</div>';
  } else {
    var pop = (S.justChecked===it.id && checked) ? " pop" : "";
    html += '<div class="check-circle'+(checked?" done":"")+pop+'" role="button" aria-pressed="'+(checked?"true":"false")+'" aria-label="Check off '+escapeHtml(it.name)+'" data-action="toggle-check" data-item="'+escapeHtml(it.id)+'">'+(checked?ICONS.check:"")+'</div>';
  }
  html += '<div class="item-body">';
  html += '<div class="item-name'+(isHistory?" done":"")+(checked?" checked":"")+'">'+(em?escapeHtml(em)+' ':'')+escapeHtml(it.name)+qtyBadge(it)+'</div>';
  if(it.note && !isHistory) html += '<div class="item-note">'+escapeHtml(it.note)+'</div>';
  if(tags.length && !isHistory) html += '<div class="item-tags">'+tags.map(function(t){return '<span class="tag-pill">'+escapeHtml(t)+'</span>';}).join("")+'</div>';
  if(isHistory){
    html += '<div class="item-meta">Bought '+escapeHtml(relTime(it.lastDoneAt))+(tags.length ? ' · '+escapeHtml(tags.join(", ")) : '')+'</div>';
  } else if(it.addedBy && S.meUid && !isMe(it.addedBy)){
    // Your own adds need no label; your partner's get a little heart so you
    // can tell at a glance what they want.
    var who = personName(it.addedBy), when = relTime(it.lastAddedAt);
    if(who) html += '<div class="item-meta">💗 '+escapeHtml(who)+' added'+(when ? ' · '+escapeHtml(when) : '')+'</div>';
  }
  html += '</div>';
  html += '</div>';
  return html;
}

      }).catch(function(){ showToast("Couldn't add that item"); });

    };
  });
  if((b=document.getElementById("move-to-history-btn"))) b.onclick = function(){
    var ids = S.items.filter(function(it){ return it.status==="active" && it.checked; }).map(function(it){ return it.id; });
    if(!ids.length) return;
    store.moveCheckedToHistory(S.spaceCode, ids).then(function(){
      showToast("Moved "+ids.length+" item"+(ids.length===1?"":"s")+" to history", {label:"Undo", run:function(){
        store.reactivateItems(S.spaceCode, ids, true).catch(function(){ showToast("Couldn't undo that"); });
      }});
    }).catch(function(){ showToast("Couldn't update your list"); });
  };
  if((b=document.getElementById("clear-history-btn"))) b.onclick = function(){
    store.clearHistory(S.spaceCode).then(function(){ showToast("History cleared"); }).catch(function(){ showToast("Couldn't clear history"); });
  };
  document.querySelectorAll('[data-action="restore"]').forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); store.restoreItem(S.spaceCode, el.getAttribute("data-item"), S.meUid).then(function(){ showToast("Added back to your list"); }).catch(function(){ showToast("Couldn't add that item"); }); };
  });
  document.querySelectorAll('.item-row[data-action="edit"]').forEach(function(row){
    row.onclick = function(){
      if(row.dataset.swiped){ delete row.dataset.swiped; return; }
      var id = row.getAttribute("data-item");

    };
    attachRowSwipe(row);
  });
}

// Swipe right = check off (or uncheck), swipe left = take off the list, with
// the same Undo as the sheet. Direction locks after 8px so vertical scrolling
// is untouched; touches starting at the left screen edge are left to iOS's
// back-swipe; re-renders are held while a finger is down.
function attachRowSwipe(row){
  var wrap = row.parentElement;
  if(!wrap || !wrap.classList.contains("swipe-wrap")) return;
  var under = {check: wrap.querySelector(".swipe-under.check"), off: wrap.querySelector(".swipe-under.off")};
  var sx=0, sy=0, dx=0, lock=null, armed=false, width=0;
  row.addEventListener("touchstart", function(e){
    if(e.touches.length!==1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; lock = null; armed = false;
    width = row.offsetWidth;
    if(sx < 24) lock = "ignore";
    row.style.transition = "none";
  }, {passive:true});
  row.addEventListener("touchmove", function(e){
    if(lock==="ignore" || e.touches.length!==1) return;
    var mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
    if(!lock){
      if(Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      lock = Math.abs(mx) > Math.abs(my) ? "x" : "ignore";
      if(lock==="x"){ S.gesturing = true; }
      else return;
    }
    if(e.cancelable) e.preventDefault();
    var max = width * 0.6;
    dx = Math.max(-max, Math.min(max, mx));
    row.style.transform = "translateX("+dx+"px)";
    var threshold = width * 0.33;
    var progress = Math.min(1, Math.abs(dx) / threshold);
    under.check.style.opacity = dx > 0 ? progress : 0;
    under.off.style.opacity = dx < 0 ? progress : 0;
    var nowArmed = Math.abs(dx) >= threshold;
    if(nowArmed && !armed) haptic();
    armed = nowArmed;
  }, {passive:false});
  function finish(){
    if(lock!=="x"){ lock = null; return; }
    lock = null;
    row.dataset.swiped = "1";
    var id = row.getAttribute("data-item");
    var item = S.items.find(function(it){ return it.id===id; });
    row.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)";
    if(armed && item && dx > 0){
      row.style.transform = "translateX("+(width*0.6)+"px)";
      S.justChecked = item.checked ? null : id;
      setTimeout(function(){ if(S.justChecked===id) S.justChecked=null; }, 600);
      store.toggleChecked(S.spaceCode, id, !item.checked).catch(function(){ showToast("Couldn't update that item"); });
    } else if(armed && item && dx < 0){
      row.style.transform = "translateX(-110%)";
      var wasChecked = !!item.checked;
      store.removeFromList(S.spaceCode, id).then(function(){
        showToast("Took "+item.name+" off the list", {label:"Undo", run:function(){
          store.reactivateItems(S.spaceCode, [id], wasChecked).catch(function(){ showToast("Couldn't undo that"); });
        }});
      }).catch(function(){ showToast("Couldn't remove that item"); });
    } else {
      row.style.transform = "";
      under.check.style.opacity = 0; under.off.style.opacity = 0;
    }
    setTimeout(endGesture, 120);
  }
  row.addEventListener("touchend", finish);
  row.addEventListener("touchcancel", finish);
}

// Pull a sheet down to dismiss it, like a native modal: from the handle or
// title anywhere, or from anywhere once the sheet's own scroll is at the top.
function attachSheetDrag(sheet){
  var sy=0, st=0, dy=0, dragging=false, fromTop=false, maybe=false;
  sheet.addEventListener("touchstart", function(e){
    if(e.touches.length!==1) return;
    sy = e.touches[0].clientY; st = Date.now(); dy = 0; dragging = false;
    fromTop = sheet.scrollTop <= 0;
    maybe = fromTop || !!(e.target.closest && e.target.closest(".sheet-handle, h2"));
    var t = e.target;
    if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="VIDEO")) maybe = false;
  }, {passive:true});
  sheet.addEventListener("touchmove", function(e){
    if(!maybe || e.touches.length!==1) return;
    var y = e.touches[0].clientY - sy;
    if(!dragging){
      if(y > 10){ dragging = true; S.gesturing = true; sheet.style.transition = "none"; }
      else if(y < -6){ maybe = false; return; }
      else return;
    }
    if(e.cancelable) e.preventDefault();
    dy = Math.max(0, y);
    sheet.style.transform = "translateY("+dy+"px)";
  }, {passive:false});
  function end(){
    if(!dragging){ maybe = false; return; }
    dragging = false; maybe = false;
    var velocity = dy / Math.max(1, Date.now()-st);
    if(dy > 110 || velocity > 0.5){
      sheet.style.transition = "transform .18s ease-in";
      sheet.style.transform = "translateY(110%)";
      setTimeout(function(){ S.gesturing = false; S.renderPending = false; closeSheet(); }, 160);
    } else {
      sheet.style.transition = "transform .25s cubic-bezier(.2,.8,.2,1)";
      sheet.style.transform = "";
      setTimeout(endGesture, 120);
    }
  }
  sheet.addEventListener("touchend", end);
  sheet.addEventListener("touchcancel", end);
}

          '<input type="text" id="rename-store-input" class="text-input" value="'+escapeHtml(s)+'" style="flex:1;" autocomplete="off">'+
          '<button class="icon-btn" type="submit" aria-label="Save">✓</button>'+
          '<button class="icon-btn" id="cancel-rename-btn" type="button" aria-label="Cancel">✕</button>'+
          '</form>';
      } else {
        html += '<div class="store-manage-row"><span>'+escapeHtml(s)+'</span><div>'+
          '<button class="icon-btn" data-rename-store="'+escapeHtml(s)+'" aria-label="Rename">'+ICONS.edit+'</button>'+
          '<button class="icon-btn" data-remove-store="'+escapeHtml(s)+'" aria-label="Remove">'+ICONS.trash+'</button></div></div>';
      }
    });
  } else {
    html += '<p class="helper-text" style="margin-bottom:10px;">No stores yet. Add ones like Costco or Trader Joe\'s so you can tag items that are only found there.</p>';
  }
  html += '<form class="add-row" id="add-store-form" style="padding:0;"><input type="text" id="new-store-input" class="text-input" placeholder="Add a store…" enterkeyhint="done">'+
    '<button class="btn btn-secondary" id="add-store-btn" type="submit">Add</button></form>';
  html += '</div>';

  html += '<div class="settings-section"><h3>You</h3>';
  if(S.renamingMe){
    html += '<form class="store-manage-row" id="rename-me-form" style="gap:8px;">'+
      '<input type="text" id="rename-me-input" class="text-input" value="'+escapeHtml(S.me||"")+'" style="flex:1;" autocomplete="off" maxlength="40">'+
      '<button class="icon-btn" type="submit" aria-label="Save">✓</button>'+
      '<button class="icon-btn" id="cancel-rename-me-btn" type="button" aria-label="Cancel">✕</button>'+
      '</form>';
  } else {
    html += '<div class="store-manage-row"><span>👤 '+escapeHtml(S.me||"")+'</span>'+
      '<button class="icon-btn" id="rename-me-btn" aria-label="Change your name">'+ICONS.edit+'</button></div>';
  }
  html += '</div>';

  html += '<div class="settings-section"><h3>Your shared list</h3>'+
    '<div class="code-box"><span class="mono">'+escapeHtml(S.spaceCode)+'</span><button class="link-btn" id="copy-code-btn">Copy</button></div>'+
    '<p class="helper-text" style="margin-bottom:10px;">Share this code so your partner can join the same list.</p>'+
    '<div class="code-box"><span class="mono" style="font-size:13px;word-break:break-all;">'+escapeHtml(shareUrl(S.spaceCode))+'</span><button class="link-btn" id="copy-link-btn" style="flex:0 0 auto;">Copy</button></div>'+
    '<p class="helper-text" style="margin-bottom:10px;">Or send this link — opening it fills in the code automatically.</p>';
  if(navigator.share){
    html += '<button class="btn btn-secondary btn-block" id="share-link-btn" style="margin-bottom:10px;">💌 Send an invite</button>';
  }
  uniquePeople(people).forEach(function(p){
    var devices = people.filter(function(q){ return sameName(q.name, p.name); }).length;
    html += '<div class="people-row">👤 '+escapeHtml(p.name)+(isMe(p.uid) ? ' <span style="font-size:12px;">(you)</span>' : '')+
      (devices > 1 ? ' <span style="font-size:12px;">· '+devices+' devices</span>' : '')+'</div>';
  });
  html += '</div>';

  html += pushStatusHtml();
  if(installTipHtml()) html += '<div class="settings-section">'+installTipHtml().replace('margin:18px 0 0','margin:0')+'</div>';

  var theme = currentTheme();
  html += '<div class="settings-section"><h3>Appearance</h3><div class="store-list" style="margin-bottom:0;">'+
    [["auto","Match system"],["light","☀️ Light"],["dark","🌙 Dark"]].map(function(opt){
      return '<button class="store-tag-toggle'+(theme===opt[0]?" on":"")+'" data-theme-pick="'+opt[0]+'">'+opt[1]+'</button>';
    }).join("")+
    '</div></div>';

  html += '<div class="settings-section">'+
    '<button class="btn btn-secondary btn-block" id="restore-starters-btn">Add default stores &amp; new starter items</button>'+
    '<p class="helper-text" style="margin:6px 0 0;">For lists started before these existed. Safe to tap more than once — never touches anything already on your list.</p>'+
    '</div>';

  html += '<div class="settings-section">'+
    '<button class="btn btn-secondary btn-block" id="switch-list-btn">Use a different list</button>'+
    '</div>';

  html += '</div></div>';
  return html;
}
function editItemSheetHtml(){
  var item = S.items.find(function(it){ return it.id===S.sheet.itemId; });
  if(!item){ S.sheet=null; return ""; }
  var stores = storesList();
  var tags = item.storeTags||[];
  var html = '<div class="sheet-backdrop'+sheetEnterClass()+'" id="sheet-backdrop"><div class="sheet">'+
    '<button class="icon-btn sheet-close" id="sheet-close-btn" aria-label="Close">✕</button>'+
    '<div class="sheet-handle"></div><h2>'+(itemEmoji(item)?escapeHtml(itemEmoji(item))+' ':'')+escapeHtml(item.name)+'</h2>';
  var qty = item.qty > 1 ? item.qty : 1;
  html += '<div class="qty-row"><label for="qty-value">Quantity</label>'+
    '<div class="stepper" role="group" aria-label="Quantity">'+
      '<button type="button" id="qty-minus" aria-label="Fewer"'+(qty<=1?' disabled':'')+'>−</button>'+
      '<output id="qty-value">'+qty+'</output>'+
      '<button type="button" id="qty-plus" aria-label="More"'+(qty>=99?' disabled':'')+'>+</button>'+
    '</div></div>';
  html += '<div class="field"><label for="item-note-input">Note (brand, size, instructions)</label>'+
    '<textarea id="item-note-input" class="text-input" rows="2" placeholder="e.g. Goya brand, the big can" style="resize:none;">'+escapeHtml(item.note||"")+'</textarea></div>';
  if(item.noteImage){
    html += '<div style="position:relative;display:inline-block;margin-bottom:14px;">'+
      '<img src="'+escapeHtml(item.noteImage)+'" alt="" style="max-width:130px;max-height:130px;border-radius:12px;display:block;border:1px solid var(--border);">'+
      '<button class="icon-btn" id="remove-note-image-btn" aria-label="Remove photo" style="position:absolute;top:-10px;right:-10px;background:var(--card);border:1px solid var(--border);border-radius:50%;">✕</button>'+
      '</div>';
  } else {
    html += '<button class="btn btn-secondary btn-block" id="scan-photo-btn" style="display:flex;align-items:center;justify-content:center;gap:8px;">'+ICONS.camera+' Try scanning for a photo</button>'+
      '<p class="helper-text" style="margin:6px 0 14px;">A nice bonus when it works — best odds on national brands and Trader Joe\'s. Fresh produce, household items, and smaller store brands often won\'t be found.</p>';
  }
  html += '<p class="helper-text">Quantity, note and photo clear automatically once this is checked off — nothing carries over next time.</p>';
  if(stores.length){
    html += '<p class="helper-text">Only available at certain stores? Tag it below.</p><div class="store-list">';
    stores.forEach(function(s){
      html += '<button class="store-tag-toggle'+(tags.indexOf(s)!==-1?" on":"")+'" data-tag="'+escapeHtml(s)+'">'+escapeHtml(s)+'</button>';
    });
    html += '</div>';
  } else {
    html += '<p class="helper-text">Add stores in Settings to tag items that are only available at specific places.</p>';
  }
  html += '<button class="btn btn-secondary btn-block" id="remove-item-btn">Remove from list</button>';
  html += '<p class="helper-text" style="margin:6px 0 0;text-align:center;">Stays in Browse so you can add it again later.</p>';
  if(S.sheet.confirmDelete){
    html += '<button class="btn btn-danger btn-block" id="delete-item-btn" style="margin-top:14px;">Yes, delete '+escapeHtml(item.name)+' forever</button>'+
      '<p class="helper-text" style="margin:6px 0 0;text-align:center;">Gone from Browse, Favorites and History too. This can\'t be undone.</p>'+
      '<div class="link-row"><button class="link-btn" id="cancel-delete-btn">Keep it</button></div>';
  } else {
    html += '<div class="link-row"><button class="link-btn danger" id="delete-item-btn">Delete this item permanently</button></div>';
  }
  var addedWhen = relTime(item.lastAddedAt);
  var addedName = personName(item.addedBy);
  if(addedWhen){
    html += '<p class="item-meta" style="text-align:center;border-top:1px solid var(--border);margin-top:16px;padding-top:12px;">'+
      (addedName ? 'Added by '+escapeHtml(addedName)+' · '+escapeHtml(addedWhen) : 'Added '+escapeHtml(addedWhen))+
      '</p>';
  }
  html += '</div></div>';
  return html;
}
// Notes save ~0.7s after typing pauses, plus right before anything else the
// sheet does (tag toggle, remove, scan, close, app backgrounded). Saving on
// blur instead would echo a re-render between mousedown and mouseup and
// swallow the very click that caused the blur.
var noteSaveTimer = null;
function flushNoteIfOpen(){
  clearTimeout(noteSaveTimer); noteSaveTimer = null;
  if(S.sheet && S.sheet.type==="editItem"){
    var noteEl = document.getElementById("item-note-input");
    var item = S.items.find(function(it){ return it.id===S.sheet.itemId; });
    if(noteEl && item && noteEl.value.trim() !== (item.note||"")){
      store.setItemNote(S.spaceCode, item.id, noteEl.value.trim()).catch(function(){ showToast("Couldn't save note"); });
    }
  }
}
window.addEventListener("pagehide", flushNoteIfOpen);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") flushNoteIfOpen(); });
function closeSheet(){
  stopActiveScan();
  flushNoteIfOpen();
  S.sheet = null; S.renamingStore = null; S.renamingMe = false;
  render();
}
function bindSheet(){
  var backdrop = document.getElementById("sheet-backdrop");
  if(backdrop){
    backdrop.onclick = function(e){ if(e.target===backdrop){ closeSheet(); } };
  }
  var closeBtn = document.getElementById("sheet-close-btn");
  if(closeBtn){
    closeBtn.onclick = closeSheet;
  }
  var sheetEl = document.querySelector(".sheet");
  if(sheetEl) attachSheetDrag(sheetEl);
  if(S.sheet.type==="settings"){
    var b, input;
    document.querySelectorAll("[data-remove-store]").forEach(function(el){
      el.onclick = function(){
        var name = el.getAttribute("data-remove-store");
        store.removeStore(S.spaceCode, name, S.items).catch(function(){ showToast("Couldn't remove that store"); });
        if(S.filterStore===name){ S.filterStore=null; }
      };
    });
    document.querySelectorAll("[data-rename-store]").forEach(function(el){
      el.onclick = function(){ S.renamingStore = el.getAttribute("data-rename-store"); render(); setTimeout(function(){ var e=document.getElementById("rename-store-input"); if(e){ e.focus(); e.select(); } },0); };
    });
    if((b=document.getElementById("cancel-rename-btn"))) b.onclick = function(){ S.renamingStore=null; render(); };
    var renameForm = document.getElementById("rename-store-form");
    if(renameForm){
      var renameOldName = renameForm.getAttribute("data-old-name");
      renameForm.onsubmit = function(e){
        e.preventDefault();
        var oldName = renameOldName;
        var newName = document.getElementById("rename-store-input").value.trim();
        if(!newName || newName===oldName){ S.renamingStore=null; render(); return; }
        var exists = storesList().some(function(st){ return st.toLowerCase()===newName.toLowerCase() && st!==oldName; });
        if(exists){ showToast("That store name is already in use"); return; }
        store.renameStore(S.spaceCode, oldName, newName, storesList(), S.items).catch(function(){ showToast("Couldn't rename that store"); });
        if(S.filterStore===oldName){ S.filterStore=newName; }
        S.renamingStore=null;
        render();
      };
    }
    if((input=document.getElementById("new-store-input"))){
      var submitStore = function(){
        var name = input.value.trim();
        if(!name) return;
        var exists = storesList().some(function(s){ return s.toLowerCase()===name.toLowerCase(); });
        if(exists){ showToast("That store is already on the list"); return; }
        store.addStore(S.spaceCode, name).catch(function(){ showToast("Couldn't add that store"); });
        input.value="";
      };
      var storeForm = document.getElementById("add-store-form");
      if(storeForm) storeForm.onsubmit = function(e){ e.preventDefault(); submitStore(); };
    }
    if((b=document.getElementById("rename-me-btn"))) b.onclick = function(){
      S.renamingMe = true; render();
      setTimeout(function(){ var e=document.getElementById("rename-me-input"); if(e){ e.focus(); e.select(); } },0);
    };
    if((b=document.getElementById("cancel-rename-me-btn"))) b.onclick = function(){ S.renamingMe=false; render(); };
    var renameMeForm = document.getElementById("rename-me-form");
    if(renameMeForm) renameMeForm.onsubmit = function(e){
      e.preventDefault();
      var newName = document.getElementById("rename-me-input").value.trim();
      if(!newName || newName===S.me){ S.renamingMe=false; render(); return; }
      var code = S.spaceCode, uid = S.meUid, people = S.space.people||[];
      var mineUids = people.filter(function(p){ return isMe(p.uid); }).map(function(p){ return p.uid; });
      if(mineUids.indexOf(uid)===-1) mineUids.push(uid);
      var newPeople = people.map(function(p){ return mineUids.indexOf(p.uid)!==-1 ? {uid:p.uid, name:newName} : p; });
      store.saveUserProfile(uid, {displayName:newName}).then(function(){
        S.me = newName;
        return Promise.all([
          store.updateSpace(code, {people: newPeople}),
          store.updatePresence(code, uid, newName)
        ]);
      }).then(function(){ showToast("You're now "+newName); })
        .catch(function(){ showToast("Couldn't change your name — try again"); });
      S.renamingMe=false; render();
    };
    if((b=document.getElementById("share-link-btn"))) b.onclick = function(){
      navigator.share({title:"Two Hearts, One Cart", text:"Join our shared grocery list 🛒💗", url: shareUrl(S.spaceCode)}).catch(function(){});
    };
    document.querySelectorAll("[data-theme-pick]").forEach(function(el){
      el.onclick = function(){ applyTheme(el.getAttribute("data-theme-pick")); render(); };
    });
    if((b=document.getElementById("enable-push-btn"))) b.onclick = enablePush;
    if((b=document.getElementById("copy-code-btn"))) b.onclick = function(){
      var code = S.spaceCode;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){ showToast("Code copied"); }).catch(function(){ showToast(code); });
      } else { showToast(code); }
    };
    if((b=document.getElementById("copy-link-btn"))) b.onclick = function(){
      var url = shareUrl(S.spaceCode);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){ showToast("Link copied"); }).catch(function(){ showToast(url); });
      } else { showToast(url); }
    };
    if((b=document.getElementById("restore-starters-btn"))) b.onclick = function(){
      var existingKeys = S.items.map(function(it){ return it.nameKey; });
      store.addMissingDefaults(S.spaceCode, existingKeys).then(function(added){
        showToast(added > 0 ? "Added "+added+" new item"+(added===1?"":"s")+" and default stores" : "Already up to date");
      }).catch(function(){ showToast("Couldn't update — try again"); });
    };
    if((b=document.getElementById("switch-list-btn"))) b.onclick = function(){
      forgetLocalSpace(); teardownSubs();
      S.spaceCode=null; S.space={stores:[],people:[]}; S.items=[]; S.presence=[]; S.sheet=null; S.filterStore=null; S.view="list";
      render();
    };
  } else if(S.sheet.type==="editItem"){
    var item = S.items.find(function(it){ return it.id===S.sheet.itemId; });
    var noteEl = document.getElementById("item-note-input");
    if(noteEl){
      noteEl.oninput = function(){
        clearTimeout(noteSaveTimer);
        noteSaveTimer = setTimeout(flushNoteIfOpen, 700);
      };
    }
    document.querySelectorAll("[data-tag]").forEach(function(el){
      el.onclick = function(){
        flushNoteIfOpen();
        var tag = el.getAttribute("data-tag");
        var tags = (item.storeTags||[]).slice();
        var idx = tags.indexOf(tag);
        if(idx===-1) tags.push(tag); else tags.splice(idx,1);
        store.setItemTags(S.spaceCode, item.id, tags).catch(function(){ showToast("Couldn't update tags"); });
      };
    });
    var rb = document.getElementById("remove-item-btn");
    if(rb) rb.onclick = function(){
      var wasChecked = !!item.checked;
      flushNoteIfOpen();
      store.removeFromList(S.spaceCode, item.id).then(function(){
        showToast("Took "+item.name+" off the list", {label:"Undo", run:function(){
          store.reactivateItems(S.spaceCode, [item.id], wasChecked).catch(function(){ showToast("Couldn't undo that"); });
        }});
      }).catch(function(){ showToast("Couldn't remove that item"); });
      S.sheet=null; render();
    };
    var db2 = document.getElementById("delete-item-btn");
    if(db2) db2.onclick = function(){
      // Two taps: the first swaps the link for a red confirm button.
      if(!S.sheet.confirmDelete){ S.sheet.confirmDelete = true; renderPreservingInput(); return; }
      clearTimeout(noteSaveTimer); noteSaveTimer = null;
      store.deleteItem(S.spaceCode, item.id).then(function(){ showToast("Deleted "+item.name); })
        .catch(function(){ showToast("Couldn't delete that item"); });
      S.sheet=null; render();
    };
    var cancelDel = document.getElementById("cancel-delete-btn");
    if(cancelDel) cancelDel.onclick = function(){ S.sheet.confirmDelete = false; renderPreservingInput(); };
    var scanBtn = document.getElementById("scan-photo-btn");
    if(scanBtn) scanBtn.onclick = function(){
      flushNoteIfOpen();
      openSheet({type:"scan", itemId:item.id});
      startBarcodeScan();
    };
    var removeImgBtn = document.getElementById("remove-note-image-btn");
    if(removeImgBtn) removeImgBtn.onclick = function(){
      store.setItemNoteImage(S.spaceCode, item.id, null).catch(function(){ showToast("Couldn't remove photo"); });
    };
    function bumpQty(delta){
      flushNoteIfOpen();
      var next = Math.max(1, Math.min(99, (item.qty > 1 ? item.qty : 1) + delta));
      store.setItemQty(S.spaceCode, item.id, next).catch(function(){ showToast("Couldn't update quantity"); });
    }
    var qm = document.getElementById("qty-minus"), qp = document.getElementById("qty-plus");
    if(qm) qm.onclick = function(){ bumpQty(-1); };
    if(qp) qp.onclick = function(){ bumpQty(+1); };
  } else if(S.sheet.type==="nudge"){
    var msgEl = document.getElementById("nudge-msg");
    if(msgEl){
      msgEl.oninput = function(){ S.sheet.message = msgEl.value; };
      msgEl.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); var sb=document.getElementById("nudge-send-btn"); if(sb) sb.click(); } };
    }
    var sendBtn = document.getElementById("nudge-send-btn");
    if(sendBtn) sendBtn.onclick = function(){
      var msg = (msgEl ? msgEl.value : "").trim() || "Anything else?";
      sendBtn.disabled = true;
      sendNudge(msg).then(function(){ S.sheet = null; render(); });
    };
    var cc = document.getElementById("copy-code-btn");
    if(cc) cc.onclick = function(){
      var code = S.spaceCode;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){ showToast("Code copied"); }).catch(function(){ showToast(code); });
      } else { showToast(code); }
    };
    var ep = document.getElementById("enable-push-btn");
    if(ep) ep.onclick = enablePush;
  } else if(S.sheet.type==="scan"){
    var cancelBtn = document.getElementById("scan-cancel-btn");
    if(cancelBtn) cancelBtn.onclick = function(){
      stopActiveScan();
      if(S.sheet.itemId) openSheet({type:"editItem", itemId:S.sheet.itemId}); else { S.sheet = null; render(); }
    };
    var confirmBtn = document.getElementById("scan-add-confirm-btn");
    if(confirmBtn) confirmBtn.onclick = function(){
      var nameInput = document.getElementById("scan-add-name");
      var name = nameInput.value.trim();
      if(!name){ showToast("Enter a name"); return; }
      var r = S.sheet.result;
      var image = r.image;
      // Use the match the sheet showed only while the name is unchanged; an
      // edited name gets exact matching, never a surprise fuzzy hit.
      var existing = (r.matchedId && name.toLowerCase()===String(r.name).toLowerCase())
        ? (S.items.find(function(it){ return it.id===r.matchedId; }) || null)
        : findExistingMatch(name);
      if(existing){
        if(existing.status==="active"){
          store.setItemNoteImage(S.spaceCode, existing.id, image).catch(function(){});
          showToast(existing.name+" is already on your list — photo added");
        } else {
          store.restoreItem(S.spaceCode, existing.id, S.meUid).then(function(){
            return store.setItemNoteImage(S.spaceCode, existing.id, image);
          }).catch(function(){ showToast("Couldn't add that item"); });
          showToast("Added "+existing.name);
        }
      } else {
        var tags = S.filterStore ? [S.filterStore] : [];
        store.createOrRestoreItem(S.spaceCode, name, tags, S.meUid, {noteImage: image}).catch(function(){ showToast("Couldn't add that item"); });
        showToast("Added "+name);
      }
      S.sheet = null;
      render();
    };
  }
}

/* ---------------- auth lifecycle ---------------- */
// No visible sign-in: an anonymous Firebase session runs silently in the
// background just to satisfy Firestore's "must be signed in" security rules.
// The only identity the user sees is the name they type on the entry screen.
onAuthStateChanged(auth, function(user){
  if(!user){
    signInAnonymously(auth).catch(function(){ showToast("Couldn't connect — check your connection and reload"); });
    return;
  }
  S.authReady = true; S.meUid = user.uid;
  store.getUserProfile(user.uid).then(function(profile){
    if(profile && profile.displayName) S.me = profile.displayName;
    var last = loadLocalSpace();
    if(!URL_JOIN_CODE && last && S.me){ enterSpace(last); } else { render(); }
  }).catch(function(){ render(); });
});
syncThemeColor();
render();

/* ---------------- service worker ---------------- */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    // updateViaCache:'none' bypasses GitHub Pages' Cache-Control: max-age=600
    // when checking sw.js for changes; reg.update() forces an immediate
    // check; auto-reload on controllerchange applies an update as soon as
    // it activates, instead of requiring a manual reopen.
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(function(reg){
      reg.update();
      var reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    }).catch(function(){});
  });
}
