<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Hearts, One Cart</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#FBF8F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="One Cart">
<style>
  :root{
    --bg:#FBF8F2; --card:#FFFFFF; --ink:#2B2320; --ink-soft:#8A8078;
    --border:#ECE6DC; --accent:#FF5D7A; --accent-soft:#FFE3E8; --accent-ink:#8C1F37;
    --done:#B9C9AE; --radius:16px; --shadow:0 1px 2px rgba(43,35,32,.06), 0 6px 20px rgba(43,35,32,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .shell{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
  button{font:inherit;}
  input{font:inherit;}
  .btn{border:none;border-radius:999px;padding:13px 20px;font-weight:600;cursor:pointer;transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--border);}
  .btn-block{width:100%;display:block;}
  .btn[disabled]{opacity:.55;}
  .link-btn{background:none;border:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:8px;}
  .icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:10px;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .icon-btn:active{background:var(--accent-soft);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input, .text-input{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--ink);
  }
  .field input:focus, .text-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;}
  .err-box{background:#FDECEC;color:#A32E2E;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;}
  .helper-text{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}

  /* onboarding / auth */
  .onboard{padding:24px 22px 40px;flex:1;display:flex;flex-direction:column;}
  .onboard-hero{text-align:center;margin:6vh 0 28px;}
  .onboard-hero .mark{font-size:52px;line-height:1;margin-bottom:14px;}
  .onboard-hero h1{font-size:26px;margin:0 0 6px;}
  .onboard-hero p{color:var(--ink-soft);margin:0;}
  .onboard-actions{display:flex;flex-direction:column;gap:10px;margin-top:auto;}
  .back-row{margin-bottom:6px;}
  .divider-row{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-soft);font-size:12px;}
  .divider-row::before,.divider-row::after{content:"";flex:1;height:1px;background:var(--border);}
  .link-row{text-align:center;margin-top:10px;}

  /* app shell */
  .app-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
  .app-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;}
  .app-title .mark{font-size:22px;}
  .tabs{display:flex;gap:6px;padding:0 18px 10px;}
  .tab-btn{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--ink-soft);font-weight:600;cursor:pointer;}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.quick{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink);}
  .chip.quick:active{transform:scale(.96);}
  .section-label{padding:6px 18px 4px;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}

  .add-row{display:flex;gap:8px;padding:6px 18px 12px;}
  .add-row input{flex:1;}
  .add-row .btn{padding:13px 18px;}

  .list{flex:1;overflow-y:auto;padding:0 18px 100px;}
  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;}
  .empty-state .mark{font-size:40px;display:block;margin-bottom:10px;}

  .item-row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .check-circle{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff;}
  .check-circle.done{background:var(--done);border-color:var(--done);color:#fff;}
  .item-body{flex:1;min-width:0;}
  .item-name{font-weight:600;word-break:break-word;}
  .item-name.done{text-decoration:line-through;color:var(--ink-soft);}
  .item-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
  .tag-pill{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:3px 8px;border-radius:999px;}
  .item-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .row-action{flex:0 0 auto;}

  /* sheet overlay */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(43,35,32,.4);display:flex;align-items:flex-end;z-index:50;}
  .sheet{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
  .sheet h2{font-size:18px;margin:0 0 14px;}
  .sheet-close{position:absolute;}
  .store-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .store-tag-toggle{padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;font-size:13px;}
  .store-tag-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .store-manage-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .settings-section{margin-bottom:22px;}
  .settings-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin:0 0 10px;}
  .code-box{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .code-box .mono{font-size:18px;font-weight:700;color:var(--accent-ink);}
  .people-row{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--ink-soft);}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:80;box-shadow:var(--shadow);}
  .loading-screen{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInAnonymously,
  setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot,
  collection, serverTimestamp, increment, arrayUnion, arrayRemove, writeBatch
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxY-rwhNvTsREJ7IvM33I0PTNNk8gxWJw",
  authDomain: "two-forks-32e3d.firebaseapp.com",
  projectId: "two-forks-32e3d",
  storageBucket: "two-forks-32e3d.firebasestorage.app",
  messagingSenderId: "514216300410",
  appId: "1:514216300410:web:88aa6bfa4951e67e6f90c3"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const dbase = getFirestore(fbApp);
setPersistence(auth, browserLocalPersistence).catch(function(){});

/* ---------------- utils ---------------- */
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function slugify(s){
  var v = String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  return v || ("item-" + Math.random().toString(36).slice(2,8));
}
var toastTimer=null;
function showToast(msg){
  S.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ S.toast=null; render(); }, 2200);
}
var CODE_WORDS = ["MILK","EGGS","BREAD","APPLE","PASTA","BASIL","MANGO","THYME","OLIVE","HONEY","PEACH","LEMON","QUINOA","GRAPE","ONION","BERRY","CHIVE","MELON"];
function genCode(){
  var w = CODE_WORDS[Math.floor(Math.random()*CODE_WORDS.length)];
  var suf = Math.random().toString(36).slice(2,5).toUpperCase();
  return w+"-"+suf;
}
function normCode(s){ return String(s||"").trim().toUpperCase().replace(/\s+/g,""); }

// Starter pack seeded into every brand-new list so quick-add isn't empty on
// day one. Also doubles as the emoji lookup (by lowercase name) for anything
// typed later that happens to match one of these names.
var STARTER_ITEMS = [
  {name:"Bananas", emoji:"🍌"},
  {name:"Avocados", emoji:"🥑"},
  {name:"Milk", emoji:"🥛"},
  {name:"Cheddar", emoji:"🧀"},
  {name:"Pepper Jack", emoji:"🧀"},
  {name:"Colby Jack", emoji:"🧀"},
  {name:"Tortilla Chips", emoji:"🌽"},
  {name:"Rice", emoji:"🍚"},
  {name:"Pasta", emoji:"🍝"},
  {name:"Apples", emoji:"🍎"},
  {name:"Red Onion", emoji:"🧅"},
  {name:"White Onion", emoji:"🧅"},
  {name:"Garlic", emoji:"🧄"},
  {name:"Frozen Pizza", emoji:"🍕"},
  {name:"Fresca", emoji:"🍋"},
  {name:"Diet Ginger Ale", emoji:"🫚"},
  {name:"Kefir", emoji:"🥛"},
  {name:"Butter", emoji:"🧈"},
  {name:"Ramen", emoji:"🍜"},
  {name:"Popcorn", emoji:"🍿"},
  {name:"Shredded Parmesan", emoji:"🧀"},
  {name:"Mozzarella", emoji:"🧀"},
  {name:"Bread", emoji:"🍞"},
  {name:"Ice Cream", emoji:"🍦"},
  {name:"Carrots", emoji:"🥕"},
  {name:"Rosemary", emoji:"🌿"},
  {name:"Cilantro", emoji:"🌱"},
  {name:"Spinach", emoji:"🥬"},
  {name:"Broccoli", emoji:"🥦"},
  {name:"Hummus", emoji:"🧆"}
];
var EMOJI_MAP = {};
STARTER_ITEMS.forEach(function(it){ EMOJI_MAP[it.name.toLowerCase()] = it.emoji; });
function relTime(iso){
  if(!iso) return "";
  var d = (iso.toDate) ? iso.toDate() : new Date(iso);
  var diffMs = Date.now() - d.getTime();
  var mins = Math.round(diffMs/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins+"m ago";
  var hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+"h ago";
  var days = Math.round(hrs/24);
  if(days < 7) return days+"d ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
/* ---------------- data layer ---------------- */
var store = {
  getUserProfile: function(uid){
    return getDoc(doc(dbase,"users",uid)).then(function(s){ return s.exists()?s.data():null; });
  },
  saveUserProfile: function(uid, data){
    return setDoc(doc(dbase,"users",uid), data, {merge:true});
  },
  ensureSpace: function(code){
    var ref = doc(dbase,"groceryLists",code);
    return getDoc(ref).then(function(snap){
      if(snap.exists()) return snap.data();
      var fresh = {stores:[], people:[], createdAt: new Date().toISOString()};
      return setDoc(ref, fresh).then(function(){ return store.seedStarterItems(code); }).then(function(){ return fresh; });
    });
  },
  seedStarterItems: function(code){
    var batch = writeBatch(dbase);
    STARTER_ITEMS.forEach(function(it){
      var nameKey = it.name.toLowerCase();
      var ref = doc(dbase,"groceryLists",code,"items",slugify(nameKey));
      batch.set(ref, {
        name: it.name, nameKey: nameKey, emoji: it.emoji,
        storeTags: [], status: "suggested", timesAdded: 0,
        createdAt: serverTimestamp(), lastAddedAt: null
      });
    });
    return batch.commit();
  },
  updateSpace: function(code, patch){ return updateDoc(doc(dbase,"groceryLists",code), patch); },
  subscribeSpace: function(code, cb){
    return onSnapshot(doc(dbase,"groceryLists",code), function(snap){ if(snap.exists()) cb(snap.data()); }, function(){});
  },
  subscribeItems: function(code, cb){
    return onSnapshot(collection(dbase,"groceryLists",code,"items"), function(snap){
      var out=[];
      snap.forEach(function(d){ out.push(Object.assign({id:d.id}, d.data())); });
      cb(out);
    }, function(){});
  },
  createOrRestoreItem: function(code, name, storeTags, uid){
    var nameKey = String(name||"").trim().toLowerCase();
    var id = slugify(nameKey);
    var ref = doc(dbase,"groceryLists",code,"items",id);
    var patch = {
      name: String(name||"").trim(),
      nameKey: nameKey,
      storeTags: storeTags || [],
      status: "active",
      timesAdded: increment(1),
      addedBy: uid,
      createdAt: serverTimestamp(),
      lastAddedAt: serverTimestamp()
    };
    if(EMOJI_MAP[nameKey]) patch.emoji = EMOJI_MAP[nameKey];
    return setDoc(ref, patch, {merge:true});
  },
  restoreItem: function(code, id){
    return updateDoc(doc(dbase,"groceryLists",code,"items",id), {
      status:"active", timesAdded: increment(1), lastAddedAt: serverTimestamp()
    });
  },
  markDone: function(code, id){
    return updateDoc(doc(dbase,"groceryLists",code,"items",id), {status:"done", lastDoneAt: serverTimestamp()});
  },
  markActive: function(code, id){
    return updateDoc(doc(dbase,"groceryLists",code,"items",id), {status:"active"});
  },
  setItemTags: function(code, id, tags){
    return updateDoc(doc(dbase,"groceryLists",code,"items",id), {storeTags: tags});
  },
  deleteItem: function(code, id){
    return deleteDoc(doc(dbase,"groceryLists",code,"items",id));
  },
  addStore: function(code, name){
    return updateDoc(doc(dbase,"groceryLists",code), {stores: arrayUnion(name)});
  },
  removeStore: function(code, name){
    return updateDoc(doc(dbase,"groceryLists",code), {stores: arrayRemove(name)});
  }
};

/* ---------------- state ---------------- */
var S = {
  authReady:false,
  meUid:null, me:null,
  spaceCode:null, loadingSpace:false, space:{stores:[], people:[]}, items:[],
  view:"list", filterStore:null, sheet:null, toast:null
};
var unsubs = [];
function teardownSubs(){ unsubs.forEach(function(u){ try{u();}catch(e){} }); unsubs=[]; }

function persistSpace(){ try{ localStorage.setItem("thoc_space", S.spaceCode||""); }catch(e){} }
function loadLocalSpace(){ try{ return localStorage.getItem("thoc_space")||null; }catch(e){ return null; } }
function forgetLocalSpace(){ try{ localStorage.removeItem("thoc_space"); }catch(e){} }

/* ---------------- render root ---------------- */
var app = document.getElementById("app");
function render(){
  var html;
  if(!S.authReady){
    html = '<div class="shell"><div class="loading-screen">Loading…</div></div>';
  } else if(!S.spaceCode || S.loadingSpace){
    html = '<div class="shell">'+ (S.loadingSpace ? '<div class="loading-screen">Opening your list…</div>' : entryHtml()) +'</div>';
  } else {
    html = '<div class="shell">'+appHtml()+'</div>';
  }
  if(S.toast) html += '<div class="toast">'+escapeHtml(S.toast)+'</div>';
  if(S.sheet) html += sheetHtml();
  app.innerHTML = html;

  if(!S.authReady) return;
  if(!S.spaceCode || S.loadingSpace){ if(!S.loadingSpace) bindEntry(); return; }
  bindApp();
  if(S.sheet) bindSheet();
}

// Real-time snapshots can fire mid-keystroke (e.g. your own write echoing
// back, or your partner editing at the same moment). A plain render() would
// wipe out whatever is being typed, so preserve the focused text input's
// value/cursor/scroll across the re-render.
function renderPreservingInput(){
  var active = document.activeElement;
  var save = null;
  if(active && active.tagName==="INPUT" && active.id){
    save = {id:active.id, value:active.value, start:active.selectionStart, end:active.selectionEnd};
  }
  render();
  if(save){
    var el = document.getElementById(save.id);
    if(el){
      el.value = save.value;
      el.focus();
      try{ el.setSelectionRange(save.start, save.end); }catch(e){}
    }
  }
}

/* ---------------- entry screen (name + list code) ---------------- */
function entryHtml(){
  var html = '<div class="onboard">';
  html += '<div class="onboard-hero"><div class="mark">🛒💗</div><h1>Two Hearts, One Cart</h1><p>One shared grocery list for the two of you.</p></div>';
  html += '<form id="entry-form">';
  if(!S.me){
    html += '<div class="field"><label for="entry-name">Your name</label><input type="text" id="entry-name" placeholder="e.g. Sam" autocomplete="off" enterkeyhint="next"></div>';
  }
  html += '<div class="field"><label for="entry-code">List code</label><input type="text" id="entry-code" class="mono" placeholder="e.g. OURLIST" autocapitalize="characters" autocomplete="off" enterkeyhint="done"></div>';
  html += '<button class="btn btn-primary btn-block" id="entry-go" type="submit">Join list</button>';
  html += '</form>';
  html += '<p class="helper-text" style="margin:14px 0 0;text-align:center;">Make up any code and share it with your partner, or <button class="link-btn" id="entry-generate" style="padding:0;">generate one</button>.</p>';
  html += '</div>';
  return html;
}
function bindEntry(){
  var nameEl = document.getElementById("entry-name");
  var codeEl = document.getElementById("entry-code");
  if(!S.me && nameEl){ setTimeout(function(){ nameEl.focus(); },0); }
  var b;
  if((b=document.getElementById("entry-generate"))) b.onclick = function(){ codeEl.value = genCode(); codeEl.focus(); };
  var form = document.getElementById("entry-form");
  if(form) form.onsubmit = function(e){
    e.preventDefault();
    var name = S.me || (nameEl ? nameEl.value.trim() : "");
    var code = normCode(codeEl.value);
    if(!name){ showToast("Enter your name"); return; }
    if(!code){ showToast("Enter a list code"); return; }
    if(S.me){ enterSpace(code); return; }
    store.saveUserProfile(S.meUid, {displayName:name}).then(function(){
      S.me = name; enterSpace(code);
    }).catch(function(){ showToast("Couldn't save your name — try again"); });
  };
}

function enterSpace(code){
  S.spaceCode = code; S.loadingSpace = true; persistSpace();
  teardownSubs();
  render();
  store.ensureSpace(code).then(function(space){
    S.space = space; S.loadingSpace = false;
    var already = (space.people||[]).some(function(p){ return p.uid===S.meUid; });
    if(!already){
      var people = (space.people||[]).concat([{uid:S.meUid, name:S.me}]);
      store.updateSpace(code, {people: people});
    }
    unsubs.push(store.subscribeSpace(code, function(sp){ S.space = sp; renderPreservingInput(); }));
    unsubs.push(store.subscribeItems(code, function(items){ S.items = items; renderPreservingInput(); }));
    render();
  }).catch(function(){
    S.loadingSpace = false; S.spaceCode = null; forgetLocalSpace();
    showToast("Couldn't open that list — check the code and try again");
  });
}

/* ---------------- main app ---------------- */
function storesList(){ return (S.space.stores||[]).slice().sort(function(a,b){return a.localeCompare(b);}); }

function matchesFilter(it){
  if(!S.filterStore) return true;
  var tags = it.storeTags||[];
  if(tags.length===0) return true;
  return tags.indexOf(S.filterStore) !== -1;
}
function activeItems(){
  return S.items.filter(function(it){ return it.status==="active" && matchesFilter(it); })
    .sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
}
function doneItems(){
  return S.items.filter(function(it){ return it.status==="done" && matchesFilter(it); })
    .sort(function(a,b){
      var ta = a.lastDoneAt && a.lastDoneAt.toMillis ? a.lastDoneAt.toMillis() : 0;
      var tb = b.lastDoneAt && b.lastDoneAt.toMillis ? b.lastDoneAt.toMillis() : 0;
      return tb-ta;
    }).slice(0,60);
}
function quickAddCandidates(){
  var activeKeys = {};
  S.items.forEach(function(it){ if(it.status==="active") activeKeys[it.nameKey]=true; });
  return S.items.filter(function(it){ return it.status!=="active" && matchesFilter(it) && !activeKeys[it.nameKey]; })
    .sort(function(a,b){
      var diff = (b.timesAdded||0)-(a.timesAdded||0);
      return diff !== 0 ? diff : (a.name||"").localeCompare(b.name||"");
    })
    .slice(0,60);
}

function appHtml(){
  var html = '<div class="app-header"><div class="app-title"><span class="mark">🛒💗</span>Two Hearts, One Cart</div>'+
    '<button class="icon-btn" id="settings-btn" aria-label="Settings">⚙️</button></div>';
  html += '<div class="tabs">'+
    '<button class="tab-btn'+(S.view==="list"?" active":"")+'" id="tab-list">List</button>'+
    '<button class="tab-btn'+(S.view==="history"?" active":"")+'" id="tab-history">History</button>'+
    '</div>';

  var stores = storesList();
  if(stores.length){
    html += '<div class="chip-row">';
    html += '<button class="chip'+(!S.filterStore?" active":"")+'" data-store="">All</button>';
    stores.forEach(function(s){
      html += '<button class="chip'+(S.filterStore===s?" active":"")+'" data-store="'+escapeHtml(s)+'">'+escapeHtml(s)+'</button>';
    });
    html += '</div>';
  }

  if(S.view==="list"){
    var quick = quickAddCandidates();
    if(quick.length){
      html += '<div class="section-label">Quick add</div><div class="chip-row">';
      quick.forEach(function(it){
        html += '<button class="chip quick" data-quickadd="'+escapeHtml(it.id)+'">+ '+(it.emoji?escapeHtml(it.emoji)+' ':'')+escapeHtml(it.name)+'</button>';
      });
      html += '</div>';
    }
    html += '<form class="add-row" id="add-item-form"><input type="text" id="new-item-input" class="text-input" placeholder="Add a grocery…" autocomplete="off" enterkeyhint="done">'+
      '<button class="btn btn-primary" id="add-item-btn" type="submit">Add</button></form>';

    var items = activeItems();
    html += '<div class="list">';
    if(!items.length){
      html += '<div class="empty-state"><span class="mark">🧺</span>'+(S.filterStore ? "Nothing tagged for "+escapeHtml(S.filterStore)+" right now." : "Your list is empty. Add something above!")+'</div>';
    } else {
      items.forEach(function(it){ html += itemRowHtml(it, false); });
    }
    html += '</div>';
  } else {
    var done = doneItems();
    html += '<div class="list" style="padding-top:8px;">';
    if(!done.length){
      html += '<div class="empty-state"><span class="mark">📜</span>Nothing checked off yet.</div>';
    } else {
      done.forEach(function(it){ html += itemRowHtml(it, true); });
    }
    html += '</div>';
  }
  return html;
}

function itemRowHtml(it, isHistory){
  var tags = (it.storeTags||[]);
  var html = '<div class="item-row" data-item="'+escapeHtml(it.id)+'" data-action="'+(isHistory?"restore":"edit")+'">';
  if(isHistory){
    html += '<div class="check-circle done" data-action="restore" data-item="'+escapeHtml(it.id)+'">+</div>';
  } else {
    html += '<div class="check-circle" data-action="done" data-item="'+escapeHtml(it.id)+'"></div>';
  }
  html += '<div class="item-body">';
  html += '<div class="item-name'+(isHistory?" done":"")+'">'+(it.emoji?escapeHtml(it.emoji)+' ':'')+escapeHtml(it.name)+'</div>';
  if(tags.length) html += '<div class="item-tags">'+tags.map(function(t){return '<span class="tag-pill">'+escapeHtml(t)+'</span>';}).join("")+'</div>';
  if(isHistory) html += '<div class="item-meta">Bought '+relTime(it.lastDoneAt)+'</div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function bindApp(){
  var b;
  if((b=document.getElementById("settings-btn"))) b.onclick = function(){ S.sheet={type:"settings"}; render(); };
  if((b=document.getElementById("tab-list"))) b.onclick = function(){ S.view="list"; render(); };
  if((b=document.getElementById("tab-history"))) b.onclick = function(){ S.view="history"; render(); };

  document.querySelectorAll("[data-store]").forEach(function(chip){
    chip.onclick = function(){
      var s = chip.getAttribute("data-store");
      S.filterStore = s ? (S.filterStore===s ? null : s) : null;
      render();
    };
  });
  document.querySelectorAll("[data-quickadd]").forEach(function(chip){
    chip.onclick = function(){
      var id = chip.getAttribute("data-quickadd");
      store.restoreItem(S.spaceCode, id).catch(function(){ showToast("Couldn't add that item"); });
    };
  });

  var input = document.getElementById("new-item-input");
  function submitNewItem(){
    var name = input.value.trim();
    if(!name) return;
    var key = name.toLowerCase();
    var existing = S.items.find(function(it){ return it.nameKey===key; });
    input.value="";
    if(existing){
      if(existing.status==="active"){ showToast(existing.name+" is already on your list"); render(); return; }
      store.restoreItem(S.spaceCode, existing.id).catch(function(){ showToast("Couldn't add that item"); });
    } else {
      var tags = S.filterStore ? [S.filterStore] : [];
      store.createOrRestoreItem(S.spaceCode, name, tags, S.meUid).catch(function(){ showToast("Couldn't add that item"); });
    }
    render();
  }
  var addForm = document.getElementById("add-item-form");
  if(addForm) addForm.onsubmit = function(e){ e.preventDefault(); submitNewItem(); };

  document.querySelectorAll('[data-action="done"]').forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); store.markDone(S.spaceCode, el.getAttribute("data-item")).catch(function(){ showToast("Couldn't update that item"); }); };
  });
  document.querySelectorAll('[data-action="restore"]').forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); store.restoreItem(S.spaceCode, el.getAttribute("data-item")).then(function(){ showToast("Added back to your list"); }).catch(function(){ showToast("Couldn't add that item"); }); };
  });
  document.querySelectorAll('.item-row[data-action="edit"]').forEach(function(row){
    row.onclick = function(){
      var id = row.getAttribute("data-item");
      var item = S.items.find(function(it){ return it.id===id; });
      if(item) { S.sheet = {type:"editItem", itemId:id}; render(); }
    };
  });
}

/* ---------------- sheets (settings / edit item) ---------------- */
function sheetHtml(){
  if(S.sheet.type==="settings") return settingsSheetHtml();
  if(S.sheet.type==="editItem") return editItemSheetHtml();
  return "";
}
function settingsSheetHtml(){
  var stores = storesList();
  var people = S.space.people||[];
  var html = '<div class="sheet-backdrop" id="sheet-backdrop"><div class="sheet">'+
    '<div class="sheet-handle"></div><h2>Settings</h2>';

  html += '<div class="settings-section"><h3>Grocery stores</h3>';
  if(stores.length){
    stores.forEach(function(s){
      html += '<div class="store-manage-row"><span>'+escapeHtml(s)+'</span>'+
        '<button class="icon-btn" data-remove-store="'+escapeHtml(s)+'" aria-label="Remove">🗑️</button></div>';
    });
  } else {
    html += '<p class="helper-text" style="margin-bottom:10px;">No stores yet. Add ones like Costco or Trader Joe\'s so you can tag items that are only found there.</p>';
  }
  html += '<form class="add-row" id="add-store-form" style="padding:0;"><input type="text" id="new-store-input" class="text-input" placeholder="Add a store…" enterkeyhint="done">'+
    '<button class="btn btn-secondary" id="add-store-btn" type="submit">Add</button></form>';
  html += '</div>';

  html += '<div class="settings-section"><h3>Your shared list</h3>'+
    '<div class="code-box"><span class="mono">'+escapeHtml(S.spaceCode)+'</span><button class="link-btn" id="copy-code-btn">Copy</button></div>'+
    '<p class="helper-text" style="margin-bottom:6px;">Share this code so your partner can join the same list.</p>';
  people.forEach(function(p){ html += '<div class="people-row">👤 '+escapeHtml(p.name)+'</div>'; });
  html += '</div>';

  html += '<div class="settings-section">'+
    '<button class="btn btn-secondary btn-block" id="switch-list-btn">Use a different list</button>'+
    '</div>';

  html += '</div></div>';
  return html;
}
function editItemSheetHtml(){
  var item = S.items.find(function(it){ return it.id===S.sheet.itemId; });
  if(!item){ S.sheet=null; return ""; }
  var stores = storesList();
  var tags = item.storeTags||[];
  var html = '<div class="sheet-backdrop" id="sheet-backdrop"><div class="sheet">'+
    '<div class="sheet-handle"></div><h2>'+(item.emoji?escapeHtml(item.emoji)+' ':'')+escapeHtml(item.name)+'</h2>';
  if(stores.length){
    html += '<p class="helper-text">Only available at certain stores? Tag it below.</p><div class="store-list">';
    stores.forEach(function(s){
      html += '<button class="store-tag-toggle'+(tags.indexOf(s)!==-1?" on":"")+'" data-tag="'+escapeHtml(s)+'">'+escapeHtml(s)+'</button>';
    });
    html += '</div>';
  } else {
    html += '<p class="helper-text">Add stores in Settings to tag items that are only available at specific places.</p>';
  }
  html += '<button class="btn btn-secondary btn-block" id="remove-item-btn">Remove from list</button>';
  html += '</div></div>';
  return html;
}
function bindSheet(){
  var backdrop = document.getElementById("sheet-backdrop");
  if(backdrop){
    backdrop.onclick = function(e){ if(e.target===backdrop){ S.sheet=null; render(); } };
  }
  if(S.sheet.type==="settings"){
    var b, input;
    document.querySelectorAll("[data-remove-store]").forEach(function(el){
      el.onclick = function(){
        var name = el.getAttribute("data-remove-store");
        store.removeStore(S.spaceCode, name).catch(function(){ showToast("Couldn't remove that store"); });
        S.items.filter(function(it){ return (it.storeTags||[]).indexOf(name) !== -1; }).forEach(function(it){
          store.setItemTags(S.spaceCode, it.id, it.storeTags.filter(function(t){ return t!==name; })).catch(function(){});
        });
        if(S.filterStore===name){ S.filterStore=null; }
      };
    });
    if((input=document.getElementById("new-store-input"))){
      var submitStore = function(){
        var name = input.value.trim();
        if(!name) return;
        var exists = storesList().some(function(s){ return s.toLowerCase()===name.toLowerCase(); });
        if(exists){ showToast("That store is already on the list"); return; }
        store.addStore(S.spaceCode, name).catch(function(){ showToast("Couldn't add that store"); });
        input.value="";
      };
      var storeForm = document.getElementById("add-store-form");
      if(storeForm) storeForm.onsubmit = function(e){ e.preventDefault(); submitStore(); };
    }
    if((b=document.getElementById("copy-code-btn"))) b.onclick = function(){
      var code = S.spaceCode;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){ showToast("Code copied"); }).catch(function(){ showToast(code); });
      } else { showToast(code); }
    };
    if((b=document.getElementById("switch-list-btn"))) b.onclick = function(){
      forgetLocalSpace(); teardownSubs();
      S.spaceCode=null; S.space={stores:[],people:[]}; S.items=[]; S.sheet=null; S.filterStore=null; S.view="list";
      render();
    };
  } else if(S.sheet.type==="editItem"){
    var item = S.items.find(function(it){ return it.id===S.sheet.itemId; });
    document.querySelectorAll("[data-tag]").forEach(function(el){
      el.onclick = function(){
        var tag = el.getAttribute("data-tag");
        var tags = (item.storeTags||[]).slice();
        var idx = tags.indexOf(tag);
        if(idx===-1) tags.push(tag); else tags.splice(idx,1);
        store.setItemTags(S.spaceCode, item.id, tags).catch(function(){ showToast("Couldn't update tags"); });
      };
    });
    var rb = document.getElementById("remove-item-btn");
    if(rb) rb.onclick = function(){
      store.deleteItem(S.spaceCode, item.id).catch(function(){ showToast("Couldn't remove that item"); });
      S.sheet=null; render();
    };
  }
}

/* ---------------- auth lifecycle ---------------- */
// No visible sign-in: an anonymous Firebase session runs silently in the
// background just to satisfy Firestore's "must be signed in" security rules.
// The only identity the user sees is the name they type on the entry screen.
onAuthStateChanged(auth, function(user){
  if(!user){
    signInAnonymously(auth).catch(function(){ showToast("Couldn't connect — check your connection and reload"); });
    return;
  }
  S.authReady = true; S.meUid = user.uid;
  store.getUserProfile(user.uid).then(function(profile){
    if(profile && profile.displayName) S.me = profile.displayName;
    var last = loadLocalSpace();
    if(last && S.me){ enterSpace(last); } else { render(); }
  }).catch(function(){ render(); });
});
render();

/* ---------------- service worker ---------------- */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
