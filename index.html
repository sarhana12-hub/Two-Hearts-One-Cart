<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Hearts, One Cart</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#FBF8F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="One Cart">
<style>
  :root{
    --bg:#FBF8F2; --card:#FFFFFF; --ink:#2B2320; --ink-soft:#8A8078;
    --border:#ECE6DC; --accent:#FF5D7A; --accent-soft:#FFE3E8; --accent-ink:#8C1F37;
    --done:#B9C9AE; --checked-green:#3F8557; --danger:#A32E2E; --radius:16px; --shadow:0 1px 2px rgba(43,35,32,.06), 0 6px 20px rgba(43,35,32,.06);
    --toast-bg:#2B2320; --toast-ink:#FFFFFF; --toast-action:#FFB3C1; --backdrop:rgba(43,35,32,.4);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1C1816; --card:#27221F; --ink:#F3EDE6; --ink-soft:#A69C93;
      --border:#3B342F; --accent:#FF6B86; --accent-soft:#3F232A; --accent-ink:#FFB3C1;
      --done:#4B6647; --checked-green:#8FCB9B; --danger:#FF8A8A; --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
      --toast-bg:#F3EDE6; --toast-ink:#2B2320; --toast-action:#8C1F37; --backdrop:rgba(0,0,0,.6);
      color-scheme:dark;
    }
    .err-box{background:#3B1F1F;color:#F3A6A6;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .shell{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;}
  button{font:inherit;touch-action:manipulation;}
  .check-circle,.item-row{touch-action:manipulation;}
  input{font:inherit;}
  textarea{font:inherit;}
  .btn{border:none;border-radius:999px;padding:13px 20px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .15s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--border);}
  .btn-block{width:100%;display:block;}
  .btn[disabled]{opacity:.55;}
  .link-btn{background:none;border:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:8px;}
  .link-btn.danger{color:var(--danger);}
  .icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:10px;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .icon-btn:active{background:var(--accent-soft);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .field input, .text-input{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--ink);
  }
  .field input:focus, .text-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;}
  .err-box{background:#FDECEC;color:#A32E2E;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .field input:focus-visible, .text-input:focus-visible{outline-offset:1px;}
  .helper-text{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}

  /* onboarding / auth */
  .onboard{padding:24px 22px 40px;flex:1;display:flex;flex-direction:column;}
  .onboard-hero{text-align:center;margin:6vh 0 28px;}
  .onboard-hero .mark{font-size:52px;line-height:1;margin-bottom:14px;}
  .onboard-hero h1{font-size:26px;margin:0 0 6px;}
  .onboard-hero p{color:var(--ink-soft);margin:0;}
  .onboard-actions{display:flex;flex-direction:column;gap:10px;margin-top:auto;}
  .back-row{margin-bottom:6px;}
  .divider-row{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-soft);font-size:12px;}
  .divider-row::before,.divider-row::after{content:"";flex:1;height:1px;background:var(--border);}
  .link-row{text-align:center;margin-top:10px;}

  /* app shell */
  .app-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
  .app-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;}
  .app-title .mark{font-size:22px;}
  .presence-banner{margin:0 18px 10px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:600;}
  .offline-pill{margin:0 18px 10px;padding:8px 12px;border-radius:12px;background:var(--border);color:var(--ink-soft);font-size:13px;font-weight:600;}
  .tabs{display:flex;gap:6px;padding:0 18px 10px;}
  .tab-btn{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--ink-soft);font-weight:600;cursor:pointer;transition:background .15s,color .15s;}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tab-count{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;font-size:11px;line-height:18px;background:var(--accent-soft);color:var(--accent-ink);vertical-align:1px;}
  .tab-btn.active .tab-count{background:rgba(255,255,255,.28);color:#fff;}
  .progress-line{display:flex;align-items:center;gap:10px;padding:0 18px 10px;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .progress-track{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden;}
  .progress-fill{height:100%;border-radius:2px;background:var(--checked-green);transition:width .3s ease;}

  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip-count{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:999px;font-size:11px;line-height:16px;text-align:center;background:var(--accent-soft);color:var(--accent-ink);}
  .chip.active .chip-count{background:rgba(255,255,255,.28);color:#fff;}
  .chip.quick{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink);}
  .chip.quick:active{transform:scale(.96);}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 90px;}
  .section-label{padding:6px 18px 4px;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}
  .suggest-list{display:flex;flex-direction:column;gap:6px;padding:0 18px 12px;}
  .suggest-row{text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;}
  .suggest-row:active{background:var(--accent-soft);border-color:var(--accent-soft);}

  .add-row{display:flex;gap:8px;padding:6px 18px 12px;}
  .add-row input{flex:1;}
  .add-row .btn{padding:13px 18px;}

  .list{flex:1;overflow-y:auto;padding:0 18px 100px;}
  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;}
  .empty-state .mark{font-size:40px;display:block;margin-bottom:10px;}

  .item-row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:transform .1s,background .15s;}
  .item-row:active{transform:scale(.99);}
  .check-circle{flex:0 0 auto;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--card);color:#fff;font-size:14px;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;}
  .check-circle:active{transform:scale(.88);}
  .check-circle.done{background:var(--done);border-color:var(--done);color:#fff;}
  .check-circle.pop{animation:pop .28s cubic-bezier(.2,.8,.3,1.4);}
  @keyframes pop{0%{transform:scale(.7);}60%{transform:scale(1.18);}100%{transform:scale(1);}}
  .item-body{flex:1;min-width:0;}
  .item-name{font-weight:600;word-break:break-word;}
  .item-name.done{text-decoration:line-through;color:var(--ink-soft);}
  .item-name.checked{text-decoration:line-through;color:var(--checked-green);}
  .item-note{font-size:13px;font-style:italic;color:var(--ink-soft);margin-top:3px;word-break:break-word;}
  .item-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
  .tag-pill{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:3px 8px;border-radius:999px;}
  .item-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .row-action{flex:0 0 auto;}
  .bottom-bar{position:sticky;bottom:0;z-index:5;padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);}

  /* sheet overlay */
  .sheet-backdrop{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:flex-end;z-index:50;}
  .sheet-backdrop.entering{animation:fade-in .18s ease-out;}
  .sheet{position:relative;background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.12);}
  .sheet.entering{animation:sheet-up .24s cubic-bezier(.2,.8,.2,1);}
  @keyframes sheet-up{from{transform:translateY(32px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
  @keyframes fade-in{from{opacity:0;}to{opacity:1;}}
  .note-row{display:flex;gap:8px;align-items:stretch;}
  .note-row .emoji-input{flex:0 0 56px;text-align:center;font-size:22px;padding:8px 4px;}
  .note-row textarea{flex:1;}
  .row-actions{display:flex;gap:2px;}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
  .sheet h2{font-size:18px;margin:0 0 14px;padding-right:30px;}
  .sheet-close{position:absolute;top:14px;right:14px;font-size:22px;line-height:1;color:var(--ink-soft);}
  .store-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .store-tag-toggle{padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;font-size:13px;}
  .store-tag-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .store-manage-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .settings-section{margin-bottom:22px;}
  .settings-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin:0 0 10px;}
  .code-box{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .code-box .mono{font-size:18px;font-weight:700;color:var(--accent-ink);}
  .people-row{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--ink-soft);}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:10px 18px;border-radius:999px;font-size:13px;z-index:80;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;max-width:calc(100% - 36px);white-space:nowrap;animation:toast-in .2s ease-out;}
  .toast span{overflow:hidden;text-overflow:ellipsis;}
  .toast button{background:none;border:none;padding:0;color:var(--toast-action);font-weight:700;font-size:13px;cursor:pointer;flex:0 0 auto;}
  @keyframes toast-in{from{transform:translate(-50%,10px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
  .loading-screen{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
</style>
</head>

const firebaseConfig = {

// Persistent local cache so the list still opens (and edits queue up) in a
// store with no signal; Firestore replays queued writes once we're back
// online. Falls back to the plain in-memory cache if IndexedDB is unavailable.
let dbase;
try {
  dbase = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) {

}
setPersistence(auth, browserLocalPersistence).catch(function(){});

/* ---------------- utils ---------------- */
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function slugify(s){
  var v = String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  return v || ("item-" + Math.random().toString(36).slice(2,8));
}
// Toasts live in their own element outside #app, so showing one never
// re-renders the app (which used to blow away focus and in-progress typing).
// Pass {label, onClick} to add an action button, e.g. Undo.
var toastTimer=null;
function showToast(msg, action){
  var root = document.getElementById("toast-root");
  if(!root) return;
  var html = '<div class="toast" role="status"><span>'+escapeHtml(msg)+'</span>';
  if(action) html += '<button type="button" id="toast-action-btn">'+escapeHtml(action.label)+'</button>';
  html += '</div>';
  root.innerHTML = html;
  if(action){
    var b = document.getElementById("toast-action-btn");
    if(b) b.onclick = function(){ hideToast(); action.onClick(); };
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 6000 : 2200);
}
function hideToast(){
  clearTimeout(toastTimer);
  var root = document.getElementById("toast-root");
  if(root) root.innerHTML = "";
}
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }
var CODE_WORDS = ["MILK","EGGS","BREAD","APPLE","PASTA","BASIL","MANGO","THYME","OLIVE","HONEY","PEACH","LEMON","QUINOA","GRAPE","ONION","BERRY","CHIVE","MELON"];
function genCode(){
  var w = CODE_WORDS[Math.floor(Math.random()*CODE_WORDS.length)];
  var suf = Math.random().toString(36).slice(2,5).toUpperCase();
  return w+"-"+suf;
}
function normCode(s){ return String(s||"").trim().toUpperCase().replace(/\s+/g,""); }
function shareUrl(code){
  var base = location.origin + location.pathname.replace(/index\.html$/, "");
  return base + "?join=" + encodeURIComponent(code);
}
var URL_JOIN_CODE = normCode(new URLSearchParams(location.search).get("join") || "");
if(URL_JOIN_CODE){
  history.replaceState(null, "", location.origin + location.pathname);
}

var DEFAULT_STORES = ["Target", "Whole Foods", "Lunds & Byerlys", "Trader Joe's"];

];
var EMOJI_MAP = {};
STARTER_ITEMS.forEach(function(it){ EMOJI_MAP[it.name.toLowerCase()] = it.emoji; });

// Best-effort emoji for anything typed that isn't a starter item. Matched as

var EMOJI_KEYWORDS = [

  ["peanut","🥜"],["peach","🍑"],["pear","🍐"],["pepper","🫑"],["paper towel","🧻"],["toilet paper","🧻"],["olive oil","🫒"],["orange juice","🧃"],

function guessEmoji(name){
  var n = String(name||"").toLowerCase();
  if(EMOJI_MAP[n]) return EMOJI_MAP[n];
  for(var i=0;i<EMOJI_KEYWORDS.length;i++){
    var kw = EMOJI_KEYWORDS[i][0];
    var idx = n.indexOf(kw);
    while(idx !== -1){
      if(idx===0 || /[^a-z]/.test(n.charAt(idx-1))) return EMOJI_KEYWORDS[i][1];
      idx = n.indexOf(kw, idx+1);
    }
  }
  return null;
}

function conciseNameFromProduct(product){
  var tags = (product.categories_tags||[]).slice().reverse();
  for(var i=0;i<tags.length;i++){
    var idx = tags[i].indexOf(":");
    var key = idx===-1 ? tags[i] : tags[i].slice(idx+1);
    if(CATEGORY_TERM_MAP[key]) return CATEGORY_TERM_MAP[key];
  }
  if(product.generic_name && product.generic_name.trim() && product.generic_name.length < 30){
    var g = product.generic_name.trim();
    return g.charAt(0).toUpperCase()+g.slice(1);
  }
  var name = String(product.product_name||"Item").replace(/\([^)]*\)/g,"").trim();
  return name.length <= 30 ? name : name.slice(0,30).trim();
}
function relTime(iso){
  if(!iso) return "";
  var d = (iso.toDate) ? iso.toDate() : new Date(iso);
  var diffMs = Date.now() - d.getTime();
  var mins = Math.floor(diffMs/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins+"m ago";
  var hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+"h ago";
  var days = Math.floor(hrs/24);
  if(days < 7) return days+"d ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function personName(uid){

/* ---------------- barcode scan -> product photo ---------------- */
// Loaded on demand (only when someone actually scans) rather than up front,
// since most visits never touch this and the library is a few hundred KB.
var zxingLoadPromise = null;
function loadZxing(){
  if(window.ZXing) return Promise.resolve();
  if(zxingLoadPromise) return zxingLoadPromise;
  zxingLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = function(){ resolve(); };
    s.onerror = function(){ zxingLoadPromise = null; reject(new Error("load failed")); };
    document.head.appendChild(s);
  });
  return zxingLoadPromise;
}
var activeScanReader = null;
function stopActiveScan(){
  if(activeScanReader){ try{ activeScanReader.reset(); }catch(e){} activeScanReader = null; }
}
function startBarcodeScan(){
  var itemId = S.sheet.itemId; // present -> attach photo to this existing item; absent -> "add new item" mode
  function goBack(){ S.sheet = itemId ? {type:"editItem", itemId:itemId} : null; render(); }
  function setStatus(msg){ var el = document.getElementById("scan-status"); if(el) el.textContent = msg; }
  loadZxing().then(function(){
    if(!(S.sheet && S.sheet.type==="scan")) return;
    var reader = new window.ZXing.BrowserMultiFormatReader();
    activeScanReader = reader;
    var pickDevice = reader.listVideoInputDevices().catch(function(){ return []; });
    return pickDevice.then(function(devices){
      var rear = devices.find(function(d){ return /back|rear|environment/i.test(d.label||""); });
      var deviceId = rear ? rear.deviceId : (devices.length ? devices[devices.length-1].deviceId : undefined);
      return reader.decodeOnceFromVideoDevice(deviceId, "scan-video");
    }).then(function(result){
      stopActiveScan();
      var code = result.getText();
      setStatus("Looking up "+code+"…");
      return fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json")
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(!data || data.status !== 1){ throw new Error("not_found"); }
          var img = data.product.image_front_url || data.product.image_url;
          if(!img){ throw new Error("no_image"); }
          return {image: img, name: conciseNameFromProduct(data.product)};
        });
    }).then(function(found){
      if(itemId){
        store.setItemNoteImage(S.spaceCode, itemId, found.image).catch(function(){ showToast("Couldn't save that photo"); });
        showToast("Photo added");
        goBack();
      } else {
        var existing = findExistingMatch(found.name);
        S.sheet = {type:"scan", result:{name: found.name, image: found.image, matchedId: existing?existing.id:null, matchedName: existing?existing.name:null}};
        render();
      }
    }).catch(function(err){
      stopActiveScan();
      var msg = "No luck this time — add a note instead?";
      if(err && err.message==="not_found") msg = "Not in the product database this time — no problem, add a note instead";
      else if(err && err.message==="no_image") msg = "Found the product, but no photo on file — add a note instead";
      else if(err && err.name==="NotAllowedError") msg = "Camera access denied — check your browser settings";
      showToast(msg);
      goBack();
    });
  }).catch(function(){
    showToast("Couldn't load the scanner — check your connection");
    goBack();
  });
}

var store = {
  getUserProfile: function(uid){
    return getDoc(doc(dbase,"users",uid)).then(function(s){ return s.exists()?s.data():null; });
  },
  saveUserProfile: function(uid, data){
    return setDoc(doc(dbase,"users",uid), data, {merge:true});
  },
  // Resolves {data, created} so the caller can tell a brand-new list apart
  // from joining one that already existed (a typo'd code silently starting a
  // fresh list is otherwise indistinguishable from a successful join).
  ensureSpace: function(code){
    var ref = doc(dbase,"groceryLists",code);
    return getDoc(ref).then(function(snap){
      if(snap.exists()) return {data: snap.data(), created:false};
      var fresh = {stores: DEFAULT_STORES.slice(), people:[], createdAt: new Date().toISOString()};
      return setDoc(ref, fresh).then(function(){ return store.seedStarterItems(code); }).then(function(){ return {data: fresh, created:true}; });
    });
  },
  addPerson: function(code, uid, name){
    return updateDoc(doc(dbase,"groceryLists",code), {people: arrayUnion({uid:uid, name:name})});
  },
  seedStarterItems: function(code){
    var batch = writeBatch(dbase);
    STARTER_ITEMS.forEach(function(it){
      var nameKey = it.name.toLowerCase();
      var ref = doc(dbase,"groceryLists",code,"items",slugify(nameKey));
      batch.set(ref, {
        name: it.name, nameKey: nameKey, emoji: it.emoji,
        storeTags: [], status: "suggested", timesAdded: 0,
        createdAt: serverTimestamp(), lastAddedAt: null
      });
    });
    return batch.commit();
  },
  addMissingDefaults: function(code, existingKeys){
    var missingItems = STARTER_ITEMS.filter(function(it){ return existingKeys.indexOf(it.name.toLowerCase()) === -1; });
    var work = [updateDoc(doc(dbase,"groceryLists",code), {stores: arrayUnion.apply(null, DEFAULT_STORES)})];
    if(missingItems.length){
      var batch = writeBatch(dbase);
      missingItems.forEach(function(it){
        var nameKey = it.name.toLowerCase();
        var ref = doc(dbase,"groceryLists",code,"items",slugify(nameKey));
        batch.set(ref, {
          name: it.name, nameKey: nameKey, emoji: it.emoji,
          storeTags: [], status: "suggested", timesAdded: 0,
          createdAt: serverTimestamp(), lastAddedAt: null
        });
      });
      work.push(batch.commit());
    }
    return Promise.all(work).then(function(){ return missingItems.length; });
  },
  updateSpace: function(code, patch){ return updateDoc(doc(dbase,"groceryLists",code), patch); },
  clearHistory: function(code){ return updateDoc(doc(dbase,"groceryLists",code), {historyClearedAt: serverTimestamp()}); },

    return onSnapshot(collection(dbase,"groceryLists",code,"items"), function(snap){
      var out=[];
      snap.forEach(function(d){ out.push(Object.assign({id:d.id}, d.data())); });
      cb(out);

// Presence: a lightweight per-person heartbeat doc so partners can see when
// each other has the list open right now. Piggybacks the same interval to
// also re-render, since "is that heartbeat now stale" only changes with time,
// not with any Firestore event we'd otherwise react to.
var presenceInterval = null;
function presenceBeat(){
  if(S.spaceCode && S.meUid && document.visibilityState==="visible"){
    store.updatePresence(S.spaceCode, S.meUid, S.me).catch(function(){});
  }
  renderPreservingInput();

  stopPresenceHeartbeat();
  presenceBeat();
  presenceInterval = setInterval(presenceBeat, 25000);
  document.addEventListener("visibilitychange", presenceBeat);

  if(presenceInterval){ clearInterval(presenceInterval); presenceInterval=null; }
  document.removeEventListener("visibilitychange", presenceBeat);

  var now = Date.now();
  return S.presence.filter(function(p){
    if(p.uid===S.meUid) return false;
    var ms = (p.lastActive && p.lastActive.toMillis) ? p.lastActive.toMillis() : 0;
    return (now-ms) < 90000;
  });

var app = document.getElementById("app");
var lastSheetKey = null;
function render(){
  // A live barcode scan owns the <video> element the ZXing reader is
  // streaming into. Rebuilding the DOM underneath it (a partner's edit, the
  // presence heartbeat) would silently kill the camera feed, so hold off;
  // whatever changed renders as soon as the scan sheet closes.
  if(S.sheet && S.sheet.type==="scan" && !S.sheet.result && activeScanReader && document.getElementById("scan-video")) return;
  var prevSheet = document.querySelector(".sheet");
  var sheetScroll = prevSheet ? prevSheet.scrollTop : 0;
  var sheetKey = S.sheet ? (S.sheet.type+":"+(S.sheet.itemId||"")+(S.sheet.result?":result":"")) : null;
  S.sheetEntering = sheetKey !== null && sheetKey !== lastSheetKey;
  lastSheetKey = sheetKey;
  var html;
  if(!S.authReady){
    html = '<div class="shell"><div class="loading-screen">Loading…</div></div>';
  } else if(!S.spaceCode || S.loadingSpace){
    html = '<div class="shell">'+ (S.loadingSpace ? '<div class="loading-screen">Opening your list…</div>' : entryHtml()) +'</div>';
  } else {
    html = '<div class="shell">'+appHtml()+'</div>';
  }
  if(S.sheet) html += sheetHtml();
  app.innerHTML = html;
  // Keep the sheet where it was scrolled: a tag toggle or a partner's edit
  // used to snap a long edit sheet back to the top.
  if(S.sheet && sheetScroll && !S.sheetEntering){
    var nextSheet = document.querySelector(".sheet");
    if(nextSheet) nextSheet.scrollTop = sheetScroll;
  }

  if(!S.authReady) return;
  if(!S.spaceCode || S.loadingSpace){ if(!S.loadingSpace) bindEntry(); return; }
  bindApp();
  if(S.sheet) bindSheet();
}

// Real-time snapshots can fire mid-keystroke (e.g. your own write echoing
// back, or your partner editing at the same moment). A plain render() would
// wipe out whatever is being typed, so preserve the focused text input's
// value/cursor/scroll across the re-render.
function renderPreservingInput(){
  var active = document.activeElement;
  var save = null;
  if(active && (active.tagName==="INPUT" || active.tagName==="TEXTAREA") && active.id){
    save = {id:active.id, value:active.value, start:active.selectionStart, end:active.selectionEnd};
  }
  render();
  if(save){
    var el = document.getElementById(save.id);
    if(el){
      el.value = save.value;
      el.focus();
      try{ el.setSelectionRange(save.start, save.end); }catch(e){}
    }
  }
}

  var html = '<div class="onboard">';
  html += '<div class="onboard-hero"><div class="mark">🛒💗</div><h1>Two Hearts, One Cart</h1><p>'+(URL_JOIN_CODE ? "You've been invited to join a list — just add your name below." : "One shared grocery list for the two of you.")+'</p></div>';
  html += '<form id="entry-form">';
  if(!S.me){
    html += '<div class="field"><label for="entry-name">Your name</label><input type="text" id="entry-name" placeholder="e.g. Sam" autocomplete="off" enterkeyhint="next"></div>';
  }
  html += '<div class="field"><label for="entry-code">List code</label><input type="text" id="entry-code" class="mono" placeholder="e.g. OURLIST" autocapitalize="characters" autocomplete="off" enterkeyhint="done" value="'+escapeHtml(URL_JOIN_CODE||"")+'"></div>';
  html += '<button class="btn btn-primary btn-block" id="entry-go" type="submit">Join list</button>';
  html += '</form>';
  html += '<p class="helper-text" style="margin:14px 0 0;text-align:center;">Make up any code and share it with your partner, or <button class="link-btn" id="entry-generate" style="padding:0;">generate one</button>.</p>';
  html += '</div>';
  return html;
}
function bindEntry(){
  var nameEl = document.getElementById("entry-name");
  var codeEl = document.getElementById("entry-code");
  if(!S.me && nameEl){ setTimeout(function(){ nameEl.focus(); },0); }
  var b;
  if((b=document.getElementById("entry-generate"))) b.onclick = function(){ codeEl.value = genCode(); codeEl.focus(); };
  var form = document.getElementById("entry-form");
  if(form) form.onsubmit = function(e){
    e.preventDefault();
    var name = S.me || (nameEl ? nameEl.value.trim() : "");
    var code = normCode(codeEl.value);
    if(!name){ showToast("Enter your name"); return; }
    if(!code){ showToast("Enter a list code"); return; }
    if(S.me){ enterSpace(code); return; }
    store.saveUserProfile(S.meUid, {displayName:name}).then(function(){
      S.me = name; enterSpace(code);
    }).catch(function(){ showToast("Couldn't save your name — try again"); });
  };
}

function enterSpace(code){
  S.spaceCode = code; S.loadingSpace = true; persistSpace();
  teardownSubs();
  render();
  store.ensureSpace(code).then(function(res){
    var space = res.data;
    S.space = space; S.loadingSpace = false;
    var already = (space.people||[]).some(function(p){ return p.uid===S.meUid; });
    if(!already){
      // arrayUnion rather than read-modify-write, so two people joining at
      // the same moment can't overwrite each other's entry.
      store.addPerson(code, S.meUid, S.me).catch(function(){});
    }
    if(res.created){
      setTimeout(function(){ showToast("Started a new list — share the code from Settings"); }, 300);
    }
    unsubs.push(store.subscribeSpace(code, function(sp){ S.space = sp; renderPreservingInput(); }));
    unsubs.push(store.subscribeItems(code, function(items){ S.items = items; renderPreservingInput(); }));
    unsubs.push(store.subscribePresence(code, function(list){ S.presence = list; renderPreservingInput(); }));
    startPresenceHeartbeat();
    render();
  }).catch(function(){
    S.loadingSpace = false; S.spaceCode = null; forgetLocalSpace();
    render();
    showToast(navigator.onLine===false ? "You're offline — this list hasn't been opened on this device before" : "Couldn't open that list — check the code and try again");
  });
}

/* ---------------- main app ---------------- */
function storesList(){ return (S.space.stores||[]).slice().sort(function(a,b){return a.localeCompare(b);}); }

function matchesFilter(it){
  if(!S.filterStore) return true;
  var tags = it.storeTags||[];
  if(tags.length===0) return true;
  return tags.indexOf(S.filterStore) !== -1;
}
function activeItems(){
  return S.items.filter(function(it){ return it.status==="active" && matchesFilter(it); })
    .sort(function(a,b){
      var ca = a.checked ? 1 : 0, cb = b.checked ? 1 : 0;
      return ca !== cb ? ca-cb : (a.name||"").localeCompare(b.name||"");
    });
}
function doneItems(){
  var cutoff = S.space.historyClearedAt;
  var cutoffMs = (cutoff && cutoff.toMillis) ? cutoff.toMillis() : 0;
  return S.items.filter(function(it){
    if(it.status!=="done" || !matchesFilter(it)) return false;
    var doneMs = (it.lastDoneAt && it.lastDoneAt.toMillis) ? it.lastDoneAt.toMillis() : 0;
    return doneMs > cutoffMs;
  }).sort(function(a,b){
    var ta = a.lastDoneAt && a.lastDoneAt.toMillis ? a.lastDoneAt.toMillis() : 0;
    var tb = b.lastDoneAt && b.lastDoneAt.toMillis ? b.lastDoneAt.toMillis() : 0;
    return tb-ta;
  }).slice(0,60);
}
function browseCandidates(){
  var activeKeys = {};
  S.items.forEach(function(it){ if(it.status==="active") activeKeys[it.nameKey]=true; });
  return S.items.filter(function(it){ return it.status!=="active" && matchesFilter(it) && !activeKeys[it.nameKey]; })
    .sort(function(a,b){
      var diff = (b.timesAdded||0)-(a.timesAdded||0);
      return diff !== 0 ? diff : (a.name||"").localeCompare(b.name||"");
    });
}
function favoriteCandidates(){
  return browseCandidates().filter(function(it){ return (it.timesAdded||0) > 0; }).slice(0,10);
}
function browseAlphabetical(){
  return browseCandidates().slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
}
function searchSuggestions(query){
  var q = query.trim().toLowerCase();
  if(!q) return [];
  return browseCandidates().filter(function(it){ return it.name.toLowerCase().indexOf(q) !== -1; }).slice(0,8);
}
// Exact nameKey match first; otherwise, only auto-match when there's exactly
// one plausible candidate, since guessing wrong is worse than treating it as
// a new item.
function findExistingMatch(name){
  var key = name.trim().toLowerCase();
  var existing = S.items.find(function(it){ return it.nameKey===key; });
  if(!existing){
    var matches = searchSuggestions(name);
    if(matches.length === 1) existing = matches[0];
  }
  return existing || null;
}

function appHtml(){
  var html = '<div class="app-header"><div class="app-title"><span class="mark">🛒💗</span>Two Hearts, One Cart</div>'+
    '<div style="display:flex;gap:2px;">'+
    '<button class="icon-btn" id="help-btn" aria-label="Help">❓</button>'+
    '<button class="icon-btn" id="settings-btn" aria-label="Settings">⚙️</button>'+
    '</div></div>';
  var partners = activePartners();
  if(partners.length){
    html += '<div class="presence-banner">🛒 '+partners.map(function(p){ return escapeHtml(p.name||"Your partner"); }).join(" & ")+' shopping now</div>';
  }
  if(!S.online){
    html += '<div class="offline-pill">📵 Offline — changes save here and sync when you\'re back</div>';
  }
  var allActive = S.items.filter(function(it){ return it.status==="active"; });
  var toBuy = allActive.filter(function(it){ return !it.checked; });
  function tab(id, label, active, count){
    return '<button class="tab-btn'+(active?" active":"")+'" id="'+id+'" role="tab" aria-selected="'+(active?"true":"false")+'">'+label+
      (count ? '<span class="tab-count">'+count+'</span>' : '')+'</button>';
  }
  html += '<div class="tabs" role="tablist">'+
    tab("tab-list","List",S.view==="list",toBuy.length)+
    tab("tab-browse","Browse",S.view==="browse",0)+
    tab("tab-history","History",S.view==="history",0)+
    '</div>';

  var stores = storesList();
  if(stores.length){
    // On the List tab each store chip carries the number of still-unchecked
    // items that are exclusive to that store, i.e. "do we need to stop there?"
    var showCounts = S.view==="list";
    html += '<div class="chip-row">';
    html += '<button class="chip'+(!S.filterStore?" active":"")+'" data-store="">All'+(showCounts && toBuy.length ? '<span class="chip-count">'+toBuy.length+'</span>' : '')+'</button>';
    stores.forEach(function(s){
      var n = showCounts ? toBuy.filter(function(it){ return (it.storeTags||[]).indexOf(s) !== -1; }).length : 0;
      html += '<button class="chip'+(S.filterStore===s?" active":"")+'" data-store="'+escapeHtml(s)+'">'+escapeHtml(s)+(n ? '<span class="chip-count">'+n+'</span>' : '')+'</button>';
    });
    html += '</div>';
  }

  if(S.view==="list"){
    html += '<form class="add-row" id="add-item-form"><input type="text" id="new-item-input" class="text-input" placeholder="Search or add a grocery…" autocomplete="off" enterkeyhint="done" value="'+escapeHtml(S.searchQuery||"")+'">'+
      '<button class="icon-btn" id="scan-add-btn" type="button" aria-label="Scan barcode to add">📷</button>'+
      '<button class="btn btn-primary" id="add-item-btn" type="submit">Add</button></form>';

    var suggestions = searchSuggestions(S.searchQuery||"");
    if(suggestions.length){
      html += '<div class="suggest-list">';
      suggestions.forEach(function(it){
        html += '<button class="suggest-row" data-quickadd="'+escapeHtml(it.id)+'">'+(it.emoji?escapeHtml(it.emoji)+' ':'')+escapeHtml(it.name)+'</button>';
      });
      html += '</div>';
    }

    var items = activeItems();
    var inCart = items.filter(function(it){ return it.checked; }).length;
    if(items.length){
      var pct = Math.round(inCart/items.length*100);
      html += '<div class="progress-line"><span>'+(inCart===items.length ? "All "+items.length+" in the cart 🎉" : inCart+" of "+items.length+" in the cart")+'</span>'+
        '<div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>';
    }
    html += '<div class="list">';
    if(!items.length){
      html += '<div class="empty-state"><span class="mark">🧺</span>'+(S.filterStore ? "Nothing tagged for "+escapeHtml(S.filterStore)+" right now." : "Your list is empty. Search above or browse common items!")+'</div>';
    } else {
      items.forEach(function(it){ html += itemRowHtml(it, false); });
    }
    html += '</div>';
    var checkedN = items.filter(function(it){ return it.checked; }).length;
    if(checkedN){
      html += '<div class="bottom-bar"><button class="btn btn-primary btn-block" id="move-to-history-btn">Move '+checkedN+' purchased item'+(checkedN===1?"":"s")+' to history</button></div>';
    }
  } else if(S.view==="browse"){
    var favorites = favoriteCandidates();
    var allBrowse = browseAlphabetical();
    html += '<div class="list" style="padding-top:8px;">';
    if(!allBrowse.length){
      html += '<div class="empty-state"><span class="mark">✅</span>'+(S.filterStore ? "Everything for "+escapeHtml(S.filterStore)+" is already on your list." : "Everything's already on your list!")+'</div>';
    } else {
      if(favorites.length){
        html += '<div class="section-label">⭐ Favorites</div><div class="chip-grid" style="padding-bottom:14px;">';
        favorites.forEach(function(it){
          html += '<button class="chip quick" data-quickadd="'+escapeHtml(it.id)+'">+ '+(it.emoji?escapeHtml(it.emoji)+' ':'')+escapeHtml(it.name)+'</button>';
        });
        html += '</div>';
      }
      html += '<div class="section-label">All items</div><div class="chip-grid">';
      allBrowse.forEach(function(it){
        html += '<button class="chip quick" data-quickadd="'+escapeHtml(it.id)+'">+ '+(it.emoji?escapeHtml(it.emoji)+' ':'')+escapeHtml(it.name)+'</button>';
      });
      html += '</div>';
    }
    html += '</div>';
  } else {
    var done = doneItems();
    if(done.length){
      html += '<div style="padding:6px 18px 0;text-align:right;"><button class="link-btn" id="clear-history-btn" style="padding:4px 0;">Clear history</button></div>';
    }
    html += '<div class="list" style="padding-top:4px;">';
    if(!done.length){
      html += '<div class="empty-state"><span class="mark">📜</span>Nothing checked off yet.</div>';
    } else {
      done.forEach(function(it){ html += itemRowHtml(it, true); });
    }
    html += '</div>';
  }
  return html;
}

function itemRowHtml(it, isHistory){
  var tags = (it.storeTags||[]);
  var checked = !isHistory && !!it.checked;
  var html = '<div class="item-row" role="button" tabindex="0" data-item="'+escapeHtml(it.id)+'" data-action="'+(isHistory?"restore":"edit")+'" aria-label="'+(isHistory ? "Add "+escapeHtml(it.name)+" back to the list" : "Edit "+escapeHtml(it.name))+'">';
  if(isHistory){
    html += '<button type="button" class="check-circle done" data-action="restore" data-item="'+escapeHtml(it.id)+'" aria-label="Add '+escapeHtml(it.name)+' back to the list">+</button>';
  } else {
    html += '<button type="button" class="check-circle'+(checked?" done":"")+(S.popId===it.id?" pop":"")+'" data-action="toggle-check" data-item="'+escapeHtml(it.id)+'" role="checkbox" aria-checked="'+(checked?"true":"false")+'" aria-label="'+escapeHtml(it.name)+'">'+(checked?"✓":"")+'</button>';
  }
  html += '<div class="item-body">';
  html += '<div class="item-name'+(isHistory?" done":"")+(checked?" checked":"")+'">'+(it.emoji?escapeHtml(it.emoji)+' ':'')+escapeHtml(it.name)+'</div>';
  if(it.note && !isHistory) html += '<div class="item-note">'+escapeHtml(it.note)+'</div>';
  if(tags.length) html += '<div class="item-tags">'+tags.map(function(t){return '<span class="tag-pill">'+escapeHtml(t)+'</span>';}).join("")+'</div>';
  if(isHistory) html += '<div class="item-meta">Bought '+relTime(it.lastDoneAt)+'</div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function bindApp(){
  var b;
  if((b=document.getElementById("settings-btn"))) b.onclick = function(){ S.sheet={type:"settings"}; render(); };
  if((b=document.getElementById("help-btn"))) b.onclick = function(){ S.sheet={type:"help", tab:S.view}; render(); };
  if((b=document.getElementById("tab-list"))) b.onclick = function(){ S.view="list"; render(); };
  if((b=document.getElementById("tab-browse"))) b.onclick = function(){ S.view="browse"; S.searchQuery=""; render(); };
  if((b=document.getElementById("tab-history"))) b.onclick = function(){ S.view="history"; S.searchQuery=""; render(); };

  document.querySelectorAll("[data-store]").forEach(function(chip){
    chip.onclick = function(){
      var s = chip.getAttribute("data-store");
      S.filterStore = s ? (S.filterStore===s ? null : s) : null;
      render();
    };
  });
  document.querySelectorAll("[data-quickadd]").forEach(function(chip){
    chip.onclick = function(){
      var id = chip.getAttribute("data-quickadd");
      store.restoreItem(S.spaceCode, id, S.meUid).catch(function(){ showToast("Couldn't add that item"); });
      S.searchQuery = "";
      render();
      setTimeout(function(){ var el = document.getElementById("new-item-input"); if(el) el.focus(); },0);
    };
  });

  var input = document.getElementById("new-item-input");
  function submitNewItem(){
    var name = input.value.trim();
    if(!name) return;
    var existing = findExistingMatch(name);
    S.searchQuery = "";
    if(existing && existing.status==="active"){
      showToast(existing.name+" is already on your list");
    } else if(existing){
      store.restoreItem(S.spaceCode, existing.id, S.meUid).catch(function(){ showToast("Couldn't add that item"); });
    } else {
      var tags = S.filterStore ? [S.filterStore] : [];
      store.createOrRestoreItem(S.spaceCode, name, tags, S.meUid).catch(function(){ showToast("Couldn't add that item"); });
    }
    render();
    setTimeout(function(){ var el = document.getElementById("new-item-input"); if(el) el.focus(); },0);
  }
  var addForm = document.getElementById("add-item-form");
  if(addForm) addForm.onsubmit = function(e){ e.preventDefault(); submitNewItem(); };
  if(input) input.oninput = function(){ S.searchQuery = input.value; renderPreservingInput(); };
  if((b=document.getElementById("scan-add-btn"))) b.onclick = function(){
    S.sheet = {type:"scan"};
    render();
    startBarcodeScan();
  };

  document.querySelectorAll('[data-action="toggle-check"]').forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var id = el.getAttribute("data-item");
      var item = S.items.find(function(it){ return it.id===id; });
      var nowChecked = !(item && item.checked);
      // Only the circle that was just tapped plays the pop; cleared before the
      // next unrelated re-render so partner edits don't replay it.
      S.popId = nowChecked ? id : null;
      setTimeout(function(){ if(S.popId===id) S.popId=null; }, 400);
      if(nowChecked) buzz();
      store.toggleChecked(S.spaceCode, id, nowChecked).catch(function(){ showToast("Couldn't update that item"); });
    };
  });
  if((b=document.getElementById("move-to-history-btn"))) b.onclick = function(){
    var moved = S.items.filter(function(it){ return it.status==="active" && it.checked; })
      .map(function(it){ return {id:it.id, checked:true, note:it.note, noteImage:it.noteImage}; });
    if(!moved.length) return;
    var ids = moved.map(function(m){ return m.id; });
    store.moveCheckedToHistory(S.spaceCode, ids).catch(function(){ showToast("Couldn't update your list"); });
    showToast("Moved "+ids.length+" item"+(ids.length===1?"":"s")+" to history", {label:"Undo", onClick:function(){
      store.putBack(S.spaceCode, moved).catch(function(){ showToast("Couldn't undo that"); });
    }});
  };
  if((b=document.getElementById("clear-history-btn"))) b.onclick = function(){
    store.clearHistory(S.spaceCode).then(function(){ showToast("History cleared"); }).catch(function(){ showToast("Couldn't clear history"); });
  };
  document.querySelectorAll('[data-action="restore"]').forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); store.restoreItem(S.spaceCode, el.getAttribute("data-item"), S.meUid).then(function(){ showToast("Added back to your list"); }).catch(function(){ showToast("Couldn't add that item"); }); };
  });
  document.querySelectorAll('.item-row[data-action="edit"]').forEach(function(row){
    row.onclick = function(){
      var id = row.getAttribute("data-item");
      var item = S.items.find(function(it){ return it.id===id; });
      if(item) { S.sheet = {type:"editItem", itemId:id}; render(); }
    };
  });
  document.querySelectorAll('.item-row').forEach(function(row){
    row.onkeydown = function(e){
      if(e.target!==row) return;
      if(e.key==="Enter" || e.key===" "){ e.preventDefault(); row.click(); }
    };
  });
}

  return '<div class="sheet-backdrop'+enter+'" id="sheet-backdrop"><div class="sheet'+enter+'" role="dialog" aria-modal="true">';
}

  if(S.sheet.type==="editItem") return editItemSheetHtml();
  if(S.sheet.type==="help") return helpSheetHtml();
  if(S.sheet.type==="scan") return scanSheetHtml();

}

function helpSheetHtml(){
  var info = HELP_TEXT[S.sheet.tab] || HELP_TEXT.list;
  var html = sheetOpen()+
    '<button class="icon-btn sheet-close" id="sheet-close-btn" aria-label="Close">✕</button>'+
    '<div class="sheet-handle"></div><h2>'+escapeHtml(info.title)+'</h2>';
  info.body.forEach(function(p){ html += '<p class="helper-text">'+escapeHtml(p)+'</p>'; });
  html += '</div></div>';
  return html;
}

  var people = S.space.people||[];
  var html = sheetOpen()+
    '<button class="icon-btn sheet-close" id="sheet-close-btn" aria-label="Close">✕</button>'+
    '<div class="sheet-handle"></div><h2>Settings</h2>';

  html += '<div class="settings-section"><h3>Grocery stores</h3>';

    stores.forEach(function(s){
      if(S.renamingStore===s){
        html += '<form class="store-manage-row" id="rename-store-form" data-old-name="'+escapeHtml(s)+'" style="gap:8px;">'+
          '<input type="text" id="rename-store-input" class="text-input" value="'+escapeHtml(s)+'" style="flex:1;" autocomplete="off">'+
          '<button class="icon-btn" type="submit" aria-label="Save">✓</button>'+
          '<button class="icon-btn" id="cancel-rename-btn" type="button" aria-label="Cancel">✕</button>'+
          '</form>';
      } else {
        html += '<div class="store-manage-row"><span>'+escapeHtml(s)+'</span><div class="row-actions">'+
          '<button class="icon-btn" data-rename-store="'+escapeHtml(s)+'" aria-label="Rename">✏️</button>'+
          '<button class="icon-btn" data-remove-store="'+escapeHtml(s)+'" aria-label="Remove">🗑️</button></div></div>';
      }
    });
  } else {
    html += '<p class="helper-text" style="margin-bottom:10px;">No stores yet. Add ones like Costco or Trader Joe\'s so you can tag items that are only found there.</p>';
  }
  html += '<form class="add-row" id="add-store-form" style="padding:0;"><input type="text" id="new-store-input" class="text-input" placeholder="Add a store…" enterkeyhint="done">'+
    '<button class="btn btn-secondary" id="add-store-btn" type="submit">Add</button></form>';
  html += '</div>';

  html += '<div class="settings-section"><h3>Your shared list</h3>'+
    '<div class="code-box"><span class="mono">'+escapeHtml(S.spaceCode)+'</span><button class="link-btn" id="copy-code-btn">Copy</button></div>'+
    '<p class="helper-text" style="margin-bottom:10px;">Share this code so your partner can join the same list.</p>'+
    '<div class="code-box"><span class="mono" style="font-size:13px;word-break:break-all;">'+escapeHtml(shareUrl(S.spaceCode))+'</span><button class="link-btn" id="copy-link-btn" style="flex:0 0 auto;">Copy</button></div>'+
    '<p class="helper-text" style="margin-bottom:6px;">Or send this link — opening it fills in the code automatically.</p>';
  people.forEach(function(p){ html += '<div class="people-row">👤 '+escapeHtml(p.name)+(p.uid===S.meUid ? ' <span style="font-size:12px;">(you)</span>' : '')+'</div>'; });
  html += '</div>';

  html += '<div class="settings-section"><h3>Your name</h3>'+
    '<form class="add-row" id="my-name-form" style="padding:0;"><input type="text" id="my-name-input" class="text-input" value="'+escapeHtml(S.me||"")+'" autocomplete="off" enterkeyhint="done">'+
    '<button class="btn btn-secondary" type="submit">Save</button></form>'+
    '<p class="helper-text" style="margin:6px 0 0;">How you show up to your partner — on items you add and in the "shopping now" banner.</p>'+
    '</div>';

  html += '<div class="settings-section">'+
    '<button class="btn btn-secondary btn-block" id="restore-starters-btn">Add default stores &amp; new starter items</button>'+
    '<p class="helper-text" style="margin:6px 0 0;">For lists started before these existed. Safe to tap more than once — never touches anything already on your list.</p>'+
    '</div>';

  html += '<div class="settings-section">'+
    '<button class="btn btn-secondary btn-block" id="switch-list-btn">Use a different list</button>'+
    '</div>';

  html += '</div></div>';
  return html;
}
function editItemSheetHtml(){
  var item = S.items.find(function(it){ return it.id===S.sheet.itemId; });
  if(!item){ S.sheet=null; return ""; }
  var stores = storesList();
  var tags = item.storeTags||[];
  var html = sheetOpen()+
    '<button class="icon-btn sheet-close" id="sheet-close-btn" aria-label="Close">✕</button>'+
    '<div class="sheet-handle"></div><h2>'+(item.emoji?escapeHtml(item.emoji)+' ':'')+escapeHtml(item.name)+'</h2>';
  html += '<div class="field"><label for="item-note-input">Note (quantity, brand, etc.)</label>'+
    '<div class="note-row">'+
    '<input type="text" id="item-emoji-input" class="text-input emoji-input" value="'+escapeHtml(item.emoji||"")+'" maxlength="4" placeholder="🛒" aria-label="Emoji" autocomplete="off">'+
    '<textarea id="item-note-input" class="text-input" rows="2" placeholder="e.g. two cans, Goya brand" style="resize:none;">'+escapeHtml(item.note||"")+'</textarea></div></div>';
  if(item.noteImage){
    html += '<div style="position:relative;display:inline-block;margin-bottom:14px;">'+
      '<img src="'+escapeHtml(item.noteImage)+'" alt="" style="max-width:130px;max-height:130px;border-radius:12px;display:block;border:1px solid var(--border);">'+
      '<button class="icon-btn" id="remove-note-image-btn" aria-label="Remove photo" style="position:absolute;top:-10px;right:-10px;background:var(--card);border:1px solid var(--border);border-radius:50%;">✕</button>'+
      '</div>';
  } else {
    html += '<button class="btn btn-secondary btn-block" id="scan-photo-btn">📷 Try scanning for a photo</button>'+
      '<p class="helper-text" style="margin:6px 0 14px;">A nice bonus when it works — best odds on national brands and Trader Joe\'s. Fresh produce, household items, and smaller store brands often won\'t be found.</p>';
  }
  html += '<p class="helper-text">Note and photo clear automatically once this is checked off — nothing carries over next time.</p>';
  if(stores.length){
    html += '<p class="helper-text">Only available at certain stores? Tag it below.</p><div class="store-list">';
    stores.forEach(function(s){
      html += '<button class="store-tag-toggle'+(tags.indexOf(s)!==-1?" on":"")+'" data-tag="'+escapeHtml(s)+'">'+escapeHtml(s)+'</button>';
    });
    html += '</div>';
  } else {
    html += '<p class="helper-text">Add stores in Settings to tag items that are only available at specific places.</p>';
  }
  html += '<button class="btn btn-secondary btn-block" id="remove-item-btn">Remove from list</button>';
  html += '<p class="helper-text" style="margin:6px 0 0;text-align:center;">Stays in Browse so you can add it again later.</p>';
  html += '<div class="link-row"><button class="link-btn danger" id="delete-item-btn">Delete this item permanently</button></div>';
  var addedWhen = relTime(item.lastAddedAt);
  var addedName = personName(item.addedBy);
  if(addedWhen){
    html += '<p class="item-meta" style="text-align:center;border-top:1px solid var(--border);margin-top:16px;padding-top:12px;">'+
      (addedName ? 'Added by '+escapeHtml(addedName)+' · '+escapeHtml(addedWhen) : 'Added '+escapeHtml(addedWhen))+
      '</p>';
  }
  html += '</div></div>';
  return html;
}
function flushNoteIfOpen(){
  if(S.sheet && S.sheet.type==="editItem"){
    var noteEl = document.getElementById("item-note-input");
    var item = S.items.find(function(it){ return it.id===S.sheet.itemId; });
    if(noteEl && item && noteEl.value !== (item.note||"")){
      store.setItemNote(S.spaceCode, item.id, noteEl.value.trim()).catch(function(){ showToast("Couldn't save note"); });
    }
  }
}
function closeSheet(){
  stopActiveScan();
  flushNoteIfOpen();
  // Backing out of a photo scan returns to the item it was for, same as the
  // Cancel button, instead of dropping back to the list.
  var back = (S.sheet && S.sheet.type==="scan" && S.sheet.itemId && !S.sheet.result) ? {type:"editItem", itemId:S.sheet.itemId} : null;
  S.sheet = back;
  render();
}
function bindSheet(){
  var backdrop = document.getElementById("sheet-backdrop");
  if(backdrop){
    backdrop.onclick = function(e){ if(e.target===backdrop){ closeSheet(); } };
  }
  var closeBtn = document.getElementById("sheet-close-btn");
  if(closeBtn){
    closeBtn.onclick = closeSheet;
  }
  if(S.sheet.type==="settings"){
    var b, input;
    document.querySelectorAll("[data-remove-store]").forEach(function(el){
      el.onclick = function(){
        var name = el.getAttribute("data-remove-store");
        store.removeStore(S.spaceCode, name).catch(function(){ showToast("Couldn't remove that store"); });
        S.items.filter(function(it){ return (it.storeTags||[]).indexOf(name) !== -1; }).forEach(function(it){
          store.setItemTags(S.spaceCode, it.id, it.storeTags.filter(function(t){ return t!==name; })).catch(function(){});
        });
        if(S.filterStore===name){ S.filterStore=null; }
      };
    });
    document.querySelectorAll("[data-rename-store]").forEach(function(el){
      el.onclick = function(){ S.renamingStore = el.getAttribute("data-rename-store"); render(); setTimeout(function(){ var e=document.getElementById("rename-store-input"); if(e){ e.focus(); e.select(); } },0); };
    });
    if((b=document.getElementById("cancel-rename-btn"))) b.onclick = function(){ S.renamingStore=null; render(); };
    var renameForm = document.getElementById("rename-store-form");
    if(renameForm){
      var renameOldName = renameForm.getAttribute("data-old-name");
      renameForm.onsubmit = function(e){
        e.preventDefault();
        var oldName = renameOldName;
        var newName = document.getElementById("rename-store-input").value.trim();
        if(!newName || newName===oldName){ S.renamingStore=null; render(); return; }
        var exists = storesList().some(function(st){ return st.toLowerCase()===newName.toLowerCase() && st!==oldName; });
        if(exists){ showToast("That store name is already in use"); return; }
        var newStores = storesList().map(function(st){ return st===oldName ? newName : st; });
        var work = [store.updateSpace(S.spaceCode, {stores: newStores})];
        S.items.filter(function(it){ return (it.storeTags||[]).indexOf(oldName) !== -1; }).forEach(function(it){
          var newTags = it.storeTags.map(function(t){ return t===oldName ? newName : t; });
          work.push(store.setItemTags(S.spaceCode, it.id, newTags));
        });
        Promise.all(work).catch(function(){ showToast("Couldn't rename that store"); });
        if(S.filterStore===oldName){ S.filterStore=newName; }
        S.renamingStore=null;
        render();
      };
    }
    if((input=document.getElementById("new-store-input"))){
      var submitStore = function(){
        var name = input.value.trim();
        if(!name) return;
        var exists = storesList().some(function(s){ return s.toLowerCase()===name.toLowerCase(); });
        if(exists){ showToast("That store is already on the list"); return; }
        store.addStore(S.spaceCode, name).catch(function(){ showToast("Couldn't add that store"); });
        input.value="";
      };
      var storeForm = document.getElementById("add-store-form");
      if(storeForm) storeForm.onsubmit = function(e){ e.preventDefault(); submitStore(); };
    }
    if((b=document.getElementById("copy-code-btn"))) b.onclick = function(){
      var code = S.spaceCode;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){ showToast("Code copied"); }).catch(function(){ showToast(code); });
      } else { showToast(code); }
    };
    if((b=document.getElementById("copy-link-btn"))) b.onclick = function(){
      var url = shareUrl(S.spaceCode);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){ showToast("Link copied"); }).catch(function(){ showToast(url); });
      } else { showToast(url); }
    };
    var nameForm = document.getElementById("my-name-form");
    if(nameForm) nameForm.onsubmit = function(e){
      e.preventDefault();
      var newName = document.getElementById("my-name-input").value.trim();
      if(!newName){ showToast("Enter a name"); return; }
      if(newName===S.me){ showToast("That's already your name"); return; }
      var people = (S.space.people||[]).map(function(p){ return p.uid===S.meUid ? {uid:p.uid, name:newName} : p; });
      if(!people.some(function(p){ return p.uid===S.meUid; })) people.push({uid:S.meUid, name:newName});
      Promise.all([
        store.saveUserProfile(S.meUid, {displayName:newName}),
        store.updateSpace(S.spaceCode, {people: people})
      ]).then(function(){
        S.me = newName;
        store.updatePresence(S.spaceCode, S.meUid, S.me).catch(function(){});
        showToast("You're now "+newName);
        render();
      }).catch(function(){ showToast("Couldn't update your name"); });
    };
    if((b=document.getElementById("restore-starters-btn"))) b.onclick = function(){
      var existingKeys = S.items.map(function(it){ return it.nameKey; });
      store.addMissingDefaults(S.spaceCode, existingKeys).then(function(added){
        showToast(added > 0 ? "Added "+added+" new item"+(added===1?"":"s")+" and default stores" : "Already up to date");
      }).catch(function(){ showToast("Couldn't update — try again"); });
    };
    if((b=document.getElementById("switch-list-btn"))) b.onclick = function(){
      forgetLocalSpace(); teardownSubs();
      S.spaceCode=null; S.space={stores:[],people:[]}; S.items=[]; S.presence=[]; S.sheet=null; S.filterStore=null; S.view="list";
      render();
    };
  } else if(S.sheet.type==="editItem"){
    var item = S.items.find(function(it){ return it.id===S.sheet.itemId; });
    var noteEl = document.getElementById("item-note-input");
    if(noteEl){
      noteEl.onblur = function(){
        if(noteEl.value !== (item.note||"")){
          store.setItemNote(S.spaceCode, item.id, noteEl.value.trim()).catch(function(){ showToast("Couldn't save note"); });
        }
      };
    }
    document.querySelectorAll("[data-tag]").forEach(function(el){
      el.onclick = function(){
        var tag = el.getAttribute("data-tag");
        var tags = (item.storeTags||[]).slice();
        var idx = tags.indexOf(tag);
        if(idx===-1) tags.push(tag); else tags.splice(idx,1);
        store.setItemTags(S.spaceCode, item.id, tags).catch(function(){ showToast("Couldn't update tags"); });
      };
    });
    var emojiEl = document.getElementById("item-emoji-input");
    if(emojiEl){
      emojiEl.onchange = function(){
        var v = emojiEl.value.trim();
        if(v === (item.emoji||"")) return;
        store.setItemEmoji(S.spaceCode, item.id, v).catch(function(){ showToast("Couldn't save emoji"); });
      };
    }
    var rb = document.getElementById("remove-item-btn");
    if(rb) rb.onclick = function(){
      var snapshot = {id:item.id, checked:false, note:item.note, noteImage:item.noteImage};
      store.removeFromList(S.spaceCode, item.id).catch(function(){ showToast("Couldn't remove that item"); });
      S.sheet=null; render();
      showToast("Took "+item.name+" off the list", {label:"Undo", onClick:function(){
        store.putBack(S.spaceCode, [snapshot]).catch(function(){ showToast("Couldn't undo that"); });
      }});
    };
    var db2 = document.getElementById("delete-item-btn");
    if(db2) db2.onclick = function(){
      // No confirm dialog; the toast's Undo is the safety net instead.
      var copy = Object.assign({}, item); delete copy.id;
      store.deleteItem(S.spaceCode, item.id).catch(function(){ showToast("Couldn't delete that item"); });
      S.sheet=null; render();
      showToast("Deleted "+item.name, {label:"Undo", onClick:function(){
        store.restoreDeleted(S.spaceCode, item.id, copy).catch(function(){ showToast("Couldn't undo that"); });
      }});
    };
    var scanBtn = document.getElementById("scan-photo-btn");
    if(scanBtn) scanBtn.onclick = function(){
      S.sheet = {type:"scan", itemId:item.id};
      render();
      startBarcodeScan();
    };
    var removeImgBtn = document.getElementById("remove-note-image-btn");
    if(removeImgBtn) removeImgBtn.onclick = function(){
      store.setItemNoteImage(S.spaceCode, item.id, null).catch(function(){ showToast("Couldn't remove photo"); });
    };
  } else if(S.sheet.type==="scan"){
    var cancelBtn = document.getElementById("scan-cancel-btn");
    if(cancelBtn) cancelBtn.onclick = function(){
      stopActiveScan();
      S.sheet = S.sheet.itemId ? {type:"editItem", itemId:S.sheet.itemId} : null;
      render();
    };
    var confirmBtn = document.getElementById("scan-add-confirm-btn");
    if(confirmBtn) confirmBtn.onclick = function(){
      var nameInput = document.getElementById("scan-add-name");
      var name = nameInput.value.trim();
      if(!name){ showToast("Enter a name"); return; }
      var image = S.sheet.result.image;
      var existing = findExistingMatch(name);
      if(existing){
        if(existing.status==="active"){
          store.setItemNoteImage(S.spaceCode, existing.id, image).catch(function(){});
          showToast(existing.name+" is already on your list — photo added");
        } else {
          store.restoreItem(S.spaceCode, existing.id, S.meUid).then(function(){
            return store.setItemNoteImage(S.spaceCode, existing.id, image);
          }).catch(function(){ showToast("Couldn't add that item"); });
          showToast("Added "+existing.name);
        }
      } else {
        var tags = S.filterStore ? [S.filterStore] : [];
        store.createOrRestoreItem(S.spaceCode, name, tags, S.meUid).then(function(newId){
          return store.setItemNoteImage(S.spaceCode, newId, image);
        }).catch(function(){ showToast("Couldn't add that item"); });
        showToast("Added "+name);
      }
      S.sheet = null;
      render();
    };
  }
}

/* ---------------- auth lifecycle ---------------- */
// No visible sign-in: an anonymous Firebase session runs silently in the
// background just to satisfy Firestore's "must be signed in" security rules.
// The only identity the user sees is the name they type on the entry screen.
onAuthStateChanged(auth, function(user){
  if(!user){
    signInAnonymously(auth).catch(function(){ showToast("Couldn't connect — check your connection and reload"); });
    return;
  }
  S.authReady = true; S.meUid = user.uid;
  store.getUserProfile(user.uid).then(function(profile){
    if(profile && profile.displayName) S.me = profile.displayName;
    var last = loadLocalSpace();
    if(!URL_JOIN_CODE && last && S.me){ enterSpace(last); } else { render(); }
  }).catch(function(){ render(); });
});
render();

/* ---------------- service worker ---------------- */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    // updateViaCache:'none' bypasses GitHub Pages' Cache-Control: max-age=600
    // when checking sw.js for changes; reg.update() forces an immediate
    // check; auto-reload on controllerchange applies an update as soon as
    // it activates, instead of requiring a manual reopen.
    // Only reload when an *existing* worker is replaced; on the very first
    // visit clients.claim() also fires controllerchange, and reloading a page
    // the user just opened is a visible flash for nothing.
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(function(reg){
      reg.update();
      var reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if (reloaded || !hadController) return;
        reloaded = true;
        location.reload();
      });
    }).catch(function(){});
  });
}
